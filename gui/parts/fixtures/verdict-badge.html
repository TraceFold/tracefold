<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>verdict-badge</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--t-record);line-height:var(--lh-record)}
</style>
</head>
<body>
<svg id="gx-glyph-sheet" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;width:0;height:0;overflow:hidden"><desc id="gx-glyph-sheet-rule">one-point red: the deny mark is the only thing in this package that is ever drawn in the deny colour. Nothing else is red, and red never means emphasis.</desc><symbol id="gx-verdict-Admit" viewBox="0 0 24 24"><desc>a movement and a gate standing open: the gate is drawn in two posts with the gap left in it</desc><path d="M3 12h15"/><path d="M14.5 8.5 18 12l-3.5 3.5"/><path d="M20.5 4.5v3.5"/><path d="M20.5 16v3.5"/></symbol><symbol id="gx-verdict-Deny" viewBox="0 0 24 24"><desc>the same gate drawn unbroken, and a movement that stops short of it</desc><path d="M3 12h9"/><path d="M8.5 8.5 12 12l-3.5 3.5"/><path d="M20.5 4.5v15"/></symbol><symbol id="gx-verdict-Escalate" viewBox="0 0 24 24"><desc>a movement turning out of its line and upward, toward a hand that is not this one</desc><path d="M3 12h9"/><path d="M11.5 12 18 5.5"/><path d="M13.5 5.5H18V10"/></symbol><symbol id="gx-standing-held" viewBox="0 0 24 24"><desc>two uprights holding a line still: the line arrives and leaves, and is stopped between them</desc><path d="M2.5 12h5"/><path d="M16.5 12h5"/><path d="M10 6.5v11"/><path d="M14 6.5v11"/></symbol><symbol id="gx-standing-cancelled" viewBox="0 0 24 24"><desc>a stroke through, which is what a clerk does to an entry that is not to be read as standing</desc><path d="M5.5 5.5 18.5 18.5"/><path d="M18.5 5.5 5.5 18.5"/></symbol><symbol id="gx-standing-conflict" viewBox="0 0 24 24"><desc>two movements meeting head on, neither yielding</desc><path d="M2 12h7.5"/><path d="M6 8.5 9.5 12 6 15.5"/><path d="M22 12h-7.5"/><path d="M18 8.5 14.5 12 18 15.5"/></symbol><symbol id="gx-standing-none" viewBox="0 0 24 24"><desc>an empty ring: a place where a standing would be written, with nothing written in it</desc><path d="M12 4.5a7.5 7.5 0 0 1 0 15 7.5 7.5 0 0 1 0-15z"/></symbol><symbol id="gx-structure-child" viewBox="0 0 24 24"><desc>an elbow descending from a line above and turning into this one: an entry written under an earlier entry, never over it</desc><path d="M7 4.5v9a4 4 0 0 0 4 4h6.5"/><path d="M14 14l3.5 3.5L14 21"/></symbol><symbol id="gx-structure-hole" viewBox="0 0 24 24"><desc>a dashed enclosure: a space that was declared and left empty, as against a space nobody mentioned</desc><path d="M4.5 6.5h15v11h-15z" stroke-dasharray="3 3"/></symbol><symbol id="gx-structure-fold-shut" viewBox="0 0 24 24"><desc>a wedge pointing along the reading direction: there is more here, and it is folded away</desc><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol><symbol id="gx-structure-fold-open" viewBox="0 0 24 24"><desc>the same wedge turned down: the fold is open and what it holds is below</desc><path d="M5.5 9.5 12 16l6.5-6.5"/></symbol><symbol id="gx-structure-seal" viewBox="0 0 24 24"><desc>a closed ring with a bar across it: a thing shut in a way that shows whether it has been opened</desc><path d="M12 4.5a7.5 7.5 0 0 1 0 15 7.5 7.5 0 0 1 0-15z"/><path d="M8 12h8"/></symbol><symbol id="gx-structure-unsealed" viewBox="0 0 24 24"><desc>the same ring with the bar left out and the circle left open at the top</desc><path d="M16.9 7.1a7.5 7.5 0 1 0 2.4 6.4"/></symbol><symbol id="gx-undefined-mark" viewBox="0 0 24 24"><desc>a dashed square around a single dot: a name was asked for and this sheet does not hold it</desc><path d="M4.5 4.5h15v15h-15z" stroke-dasharray="2 3"/><path d="M12 12h0.01"/></symbol></svg>
<main style="padding:0 16px 40px;max-width:100%"><section style="padding:16px 0;border-bottom:1px solid var(--line)"><h2 style="margin:0 0 8px;color:var(--ink-2);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:600;letter-spacing:0.08em;text-transform:uppercase">the three words the engine says, and one it does not</h2><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span data-part="verdict-badge" data-verdict="Admit" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Admit" data-mark="verdict/Admit" data-means="verdict.admit" style="width:14px;height:14px;display:block;flex:none"><use href="#gx-verdict-Admit"/></svg><span data-role="word">Admit</span></span><span data-part="verdict-badge" data-verdict="Deny" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--deny);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Deny" data-mark="verdict/Deny" data-means="verdict.deny" style="width:14px;height:14px;display:block;flex:none"><use href="#gx-verdict-Deny"/></svg><span data-role="word">Deny</span></span><span data-part="verdict-badge" data-verdict="Escalate" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Escalate" data-mark="verdict/Escalate" data-means="verdict.escalate" style="width:14px;height:14px;display:block;flex:none"><use href="#gx-verdict-Escalate"/></svg><span data-role="word">Escalate</span></span><span data-part="verdict-badge" data-verdict="undefined" data-defined="false" title="a word arrived where a verdict was expected and this sheet does not hold it: &quot;approved&quot;" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="undefined mark: verdict/approved" data-mark="undefined" data-means="mark.undefined" style="width:14px;height:14px;display:block;flex:none"><use href="#gx-undefined-mark"/></svg><span data-role="word">undefined mark</span></span><span data-part="verdict-badge" data-verdict="undefined" data-defined="false" title="a word arrived where a verdict was expected and this sheet does not hold it: null" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="undefined mark: verdict/null" data-mark="undefined" data-means="mark.undefined" style="width:14px;height:14px;display:block;flex:none"><use href="#gx-undefined-mark"/></svg><span data-role="word">undefined mark</span></span></div></section><section style="padding:16px 0;border-bottom:1px solid var(--line)"><h2 style="margin:0 0 8px;color:var(--ink-2);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:600;letter-spacing:0.08em;text-transform:uppercase">the same badges with the word withheld, so only the shape carries it</h2><div style="display:flex;gap:20px;align-items:center"><span data-part="verdict-badge" data-verdict="Admit" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Admit" data-mark="verdict/Admit" data-means="verdict.admit" style="width:22px;height:22px;display:block;flex:none"><use href="#gx-verdict-Admit"/></svg></span><span data-part="verdict-badge" data-verdict="Deny" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--deny);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Deny" data-mark="verdict/Deny" data-means="verdict.deny" style="width:22px;height:22px;display:block;flex:none"><use href="#gx-verdict-Deny"/></svg></span><span data-part="verdict-badge" data-verdict="Escalate" data-defined="true" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--sans);font-size:var(--t-meta);line-height:var(--lh-meta);white-space:nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Escalate" data-mark="verdict/Escalate" data-means="verdict.escalate" style="width:22px;height:22px;display:block;flex:none"><use href="#gx-verdict-Escalate"/></svg></span></div></section></main>
</body>
</html>
