<title>fixture: rt08 double draw</title>
<!--
  SPDX-License-Identifier: Apache-2.0
  KA-I2 live round, defect three: the sheet is painted twice, the second copy a
  fraction of a pixel off, which is what "the palette printed itself twice" looks
  like from outside. Nothing in the box tree is wrong -- the ghost is a second
  stacking context sitting exactly where the first one is -- so neither a rect
  reading nor a glyph-size reading can see it. P-c must go red against the
  clean-baseline ink.
  Diff against clean-baseline.html: one wrapper, one duplicated sheet, one transform.
-->
