# The offline-verification half of the TypeScript SDK.
#
# A spike built the four engine crates a receipt's offline check touches (gx-core/gx-canon/gx-log/
# gx-witness) for `wasm32-unknown-unknown` before this crate was written, and read the verify path
# itself to see whether it calls `getrandom` at all. It does not -- `gx_witness::receipt::verify_offline`
# reaches `ed25519_dalek::VerifyingKey::verify_strict` (a public-key operation) and
# `gx_canon`/`gx_log`'s deterministic hashing, and the only caller of `getrandom::fill` in this
# dependency graph is `KeyPair::generate` (`crates/gx-witness/src/keys.rs`), which this crate never
# calls. Measured (`Desktop/GitRepo/REFERENCES.md`, 2026-08-14): the four crates build clean as
# `wasm32-unknown-unknown` rlibs, and a `wasm-bindgen`-linked module exposing only
# [`verify_receipt_offline`] below imports **no** `getrandom`/entropy host function at all --
# `wasm-bindgen`'s own placeholder/externref plumbing is the whole import table, because nothing this
# crate calls reaches the code path that would need one.
[package]
# Directory-basename == package-name (`probes/doubt` -> `doubt`, `crates/gx-core` -> `gx-core`):
# `probes/doubt/tests/workspace_doubt.rs::the_member_names_in_ci_are_the_member_names_in_the_manifest`
# derives a member's name from its path's last component and compares it against `cargo metadata`'s
# own name, so this crate is named after its directory (`sdk/wasm-verify`) rather than carrying the
# `gx-` prefix the product crates use — it is SDK tooling bundled into an npm package, not a 13th
# `gx-*` product crate (the same non-`gx-` standing `doubt` already has).
name = "wasm-verify"
description = "wasm32 receipt offline verification, exposed to JS via wasm-bindgen."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the workspace's adopted
                                       # MSRV decision (sem: SEM-sdk-wasm-verify-001)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # ships inside the npm package's dist/, not to crates.io (same
                                       # standing as gx-substrate-conformance / probes/doubt)

[lib]
crate-type = ["cdylib", "rlib"]        # cdylib: what `wasm-bindgen` links; rlib: what `cargo test`
                                        # runs the assertions below against, on the host target

[dependencies]
gx-core = { path = "../../crates/gx-core", version = "0.1.2", package = "tracefold-core" }
gx-witness = { path = "../../crates/gx-witness", version = "0.1.2", package = "tracefold-witness" }
serde_json = "1"

# gh primary-source check (crates.io API + GitHub API, `Desktop/GitRepo/REFERENCES.md` 2026-08-14;
# sem: SEM-sdk-wasm-verify-002): MIT OR Apache-2.0,
# `wasm-bindgen/wasm-bindgen`, not archived, 9k+ stars. The one dependency this crate adds beyond
# what the workspace graph already carries (`ed25519-dalek`, `getrandom`, `serde`, `serde_json`
# are all already there via gx-witness). Builds and lints clean on the host target too (verified
# above), which is what lets this crate sit in the ordinary `--workspace` clippy/test scope rather
# than needing a carve-out.
wasm-bindgen = "0.2"

[dev-dependencies]
# For `tests/`: producing a signed fixture receipt to feed the exported function needs the same
# signing half `gx-witness`'s own suites use, and it is a dev-only need (the shipped function only
# verifies, never signs).
ed25519-dalek = "3"
# 🔴 The three negative-control tests need a *real* anchor to attack -- a
# `TileLog` the fixture appends to, the `InclusionProof` that log produces, and the head it would
# publish (`gx_log::proof::unsigned_checkpoint`, then `gx_witness::dsse::sign_checkpoint`). A
# hand-built `Checkpoint` would let the tests pass against a verifier that never walked an audit
# path, which is the failure mode `crates/gx-witness/tests/ac_070.rs` already warns about. Dev-only:
# the shipped function reads a checkpoint, it never builds one.
gx-log = { path = "../../crates/gx-log", version = "0.1.2", package = "tracefold-log" }
