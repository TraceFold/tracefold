<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a09"/>
      <stop offset="50%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9b998"/>
      <stop offset="50%" stop-color="#ece7da"/>
      <stop offset="100%" stop-color="#c9b998"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3128"/>
      <stop offset="100%" stop-color="#26231f"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f1d1a" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="12" fill="url(#grid)" opacity="0.6"/>
  <rect width="900" height="240" rx="12" fill="none" stroke="#332e27" stroke-width="1.5"/>

  <!-- Glowing accent border top -->
  <path d="M 12 1 L 888 1" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Left Accent Badge -->
  <rect x="40" y="38" width="140" height="26" rx="4" fill="url(#accentGrad)" stroke="#4a3e31" stroke-width="1"/>
  <text x="110" y="55" fill="#c9b998" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">RESEARCH LEAD</text>

  <!-- Name & Title -->
  <text x="40" y="102" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Mahiro Hirakawa</text>
  <text x="40" y="132" fill="#8c8275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Creator of TraceFold &middot; Independent Formal Systems &amp; Reversible AI R&amp;D</text>

  <!-- Quote Box -->
  <rect x="40" y="155" width="820" height="52" rx="6" fill="#141210" stroke="#26231f" stroke-width="1"/>
  <path d="M 40 155 L 40 207" stroke="#c9b998" stroke-width="3.5"/>
  <text x="56" y="177" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">"Undo is a feature; reversibility is a property."</text>
  <text x="56" y="196" fill="#8c8275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Holding checked inverses before AI actions land &middot; Zero-trust offline verifiable receipts</text>

  <!-- Right Pill Stats -->
  <g transform="translate(680, 38)">
    <rect width="180" height="26" rx="4" fill="#1c1916" stroke="#332e27" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#52b788"/>
    <text x="26" y="17" fill="#ece7da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">154 Merged PRs / 144 Repos</text>
  </g>
</svg>
