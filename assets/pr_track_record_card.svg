<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100e"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="10" fill="url(#cardBg)" stroke="#26231f" stroke-width="1.5"/>

  <!-- Header -->
  <text x="35" y="38" fill="#c9b998" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PROVEN UPSTREAM CONTRIBUTION LEDGER</text>
  <text x="35" y="68" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">154 Merged PRs Across 144 Open-Source Repositories</text>

  <!-- 4 Major Project Badges in Grid -->
  <g transform="translate(35, 95)">
    <!-- Box 1: Ant Design -->
    <rect width="190" height="75" rx="6" fill="#171512" stroke="#332e27" stroke-width="1"/>
    <text x="16" y="28" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ant-design / ant-design</text>
    <rect x="16" y="42" width="68" height="18" rx="3" fill="#26231f"/>
    <text x="50" y="55" fill="#52b788" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">MERGED</text>
    <text x="92" y="55" fill="#8c8275" font-family="ui-monospace, monospace" font-size="10">Enterprise UI</text>

    <!-- Box 2: Material UI -->
    <g transform="translate(205, 0)">
      <rect width="190" height="75" rx="6" fill="#171512" stroke="#332e27" stroke-width="1"/>
      <text x="16" y="28" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">mui / material-ui</text>
      <rect x="16" y="42" width="68" height="18" rx="3" fill="#26231f"/>
      <text x="50" y="55" fill="#52b788" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">MERGED</text>
      <text x="92" y="55" fill="#8c8275" font-family="ui-monospace, monospace" font-size="10">React Stack</text>
    </g>

    <!-- Box 3: Vite -->
    <g transform="translate(410, 0)">
      <rect width="190" height="75" rx="6" fill="#171512" stroke="#332e27" stroke-width="1"/>
      <text x="16" y="28" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">vitejs / vite</text>
      <rect x="16" y="42" width="68" height="18" rx="3" fill="#26231f"/>
      <text x="50" y="55" fill="#52b788" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">MERGED</text>
      <text x="92" y="55" fill="#8c8275" font-family="ui-monospace, monospace" font-size="10">Build Tooling</text>
    </g>

    <!-- Box 4: Gin -->
    <g transform="translate(615, 0)">
      <rect width="215" height="75" rx="6" fill="#171512" stroke="#332e27" stroke-width="1"/>
      <text x="16" y="28" fill="#ece7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">gin-gonic / gin</text>
      <rect x="16" y="42" width="68" height="18" rx="3" fill="#26231f"/>
      <text x="50" y="55" fill="#52b788" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">MERGED</text>
      <text x="92" y="55" fill="#8c8275" font-family="ui-monospace, monospace" font-size="10">Go Web Infra</text>
    </g>
  </g>
</svg>
