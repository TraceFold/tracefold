# Provenance, evidence and the signed receipt. The architecture spec gives this crate its module list
# (`src/{lib,provenance,receipt,evidence,dsse,keys}.rs`) and its dependency line (`ed25519-dalek`);
# the field-table spec gives the field tables those modules carry.
[package]
# 🔴 registry rename (req/1032 §5 point 1 -> LOOP_STATE #312, 2026-09-01): publish name becomes
# "tracefold-witness"; [lib] name stays "gx_witness" so no source line changes anywhere.
name = "tracefold-witness"
description = "Provenance, evidence and DSSE-signed receipts."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the
                                       # workspace, per the adopted MSRV decision (sem: SEM-gx-witness-001)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
repository.workspace = true           # crates.io metadata; also read by `dist generate`
publish = true                        # req/1032/req/1035 blockers resolved -- this crate is a real publish target now
readme = "README.md"                  # crates.io page body (2026-09-01, this lane: metadata completeness check)
keywords = ["agent-safety", "reversibility", "provenance", "verification"]

[lib]
name = "gx_witness"

# The edge that an early ruling made one-way. This crate names gx-core
# and gx-log names gx-core; neither names the other, so the cycle the field-table spec would have
# produced is absent from the graph rather than forbidden by a convention. gx-canon is NOT here:
# an early hand needs no canonical encoding, and a dependency declared before its first use cannot be
# reviewed against a reason. A later hand adds it when `Provenance` first needs a CID.
#
# `version` beside `path`: see gx-canon's manifest for why (`cargo deny check bans`).
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2", package = "tracefold-core" }

# A later hand. The field-table spec gives `Evidence` an IdentityView row (all fields, no exclusions) (sem:
# SEM-gx-witness-002), so the type needs a
# CID, and the architecture spec routes every canonical encode through gx-canon: `IdentityView` is
# declared there, and `cid::compute` is the only road to a digest (checked by one of gx-canon's
# acceptance criteria). Declaring the edge here is what lets
# `evidence.rs` implement the trait for a local type without gx-witness ever naming BLAKE3 or a CBOR
# codec -- `tests/evidence_cid.rs` reads the source and fails if it does. No cycle: gx-canon names
# gx-core and nothing else in this workspace.
gx-canon = { path = "../gx-canon", version = "0.1.2", package = "tracefold-canon" }

# A later hand. One acceptance criterion verifies a `CommitReceipt`'s inclusion proof offline and a
# ruling attaches a signature over `gx_log::proof::
# checkpoint_signing_bytes`; both are gx-log's arithmetic, and a second copy of a merkle verifier is
# the drift an earlier ruling moved the `Proof` family down to gx-core to avoid. The edge runs one way --
# gx-log does not name this crate -- so that earlier one-way ruling's cycle is still absent from the
# graph and cargo, not a convention, is what says so. `tests/ac_018.rs` reads gx-log's manifest and
# fails if that ever changes. The architecture spec's informal dep line for gx-witness names neither
# this nor gx-canon.
gx-log = { path = "../gx-log", version = "0.1.2", package = "tracefold-log" }

# Named on this crate's dependency line in the architecture spec and approved in a research note.
# Versions are the max_stable_version read off the crates.io API on 2026-08-07; every license was
# checked at three points (crates.io API, GitHub API, LICENSE file in the repository) and written
# into Desktop/GitRepo/REFERENCES.md the same day.
#
# 3.0.0 declares rust-version 1.85, which is exactly this workspace's floor -- so a future patch
# release that raises its MSRV raises ours. `--locked` in CI pins what was reviewed; 2.2.0 (MSRV
# 1.81) is the fallback if that floor ever moves before ours does.
ed25519-dalek = "3"                   # DSSE signature and verification requirements

# base64 is NOT here. An early hand declared `base64 = "0.23"` for the stdout spec's "`payload` is
# base64" (sem:
# SEM-gx-witness-003) and
# a later review re-opened the version at first use rather than at declaration, because the release was
# published three days earlier and had not soaked. A later hand is that first use and takes the other
# branch: `gx_core::b64` writes RFC 4648 §4 out longhand, next to the base32 table the architecture
# spec already
# made gx-core write for `Cid` -- one crate, one place where an alphabet lives, and the same spec's
# "serde, thiserror and not much more" (sem: SEM-gx-witness-004) respected on the crate that would
# otherwise have taken the dependency.
# `gx-core/tests/base64_vectors.rs` checks the table against RFC 4648 §10's own vectors, and the
# package leaves the dependency tree with the declaration.

# Ed25519 seeds. `SigningKey::generate` needs ed25519-dalek's `rand_core` feature, which is off by
# default and would pull `rand_core` 0.10 into the graph for one call; `KeyPair::from_seed` takes the
# thirty-two bytes and this fills them. Already in the tree (0.3.4).
getrandom = "0.3"                     # key-generation requirement

# The architecture spec: "errors are typed with thiserror" (sem: SEM-gx-witness-005). serde carries
# every field table.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# The field-table spec types `InTotoStatementRef.inline` as `Option<serde_json::Value>`, so the field
# table puts this crate in the dependency rather than the dev-dependency column. Already in the
# graph: gx-canon carries it for `Intent.goal` under an approved-dependency ruling, so this hand adds
# no package to the tree.
serde_json = "1"

# 🔴 A licensing review (RustCrypto pure-Rust, gh primary-source +
# recorded in REFERENCES.md `Desktop/GitRepo/REFERENCES.md` 2026-08-14) (sem: SEM-gx-witness-006).
# Key-at-rest encryption (opt-in)
# for [`keys::KeyPair::save_encrypted`]/[`keys::KeyPair::load_encrypted`]. `default-features =
# false` on both: argon2's default set pulls in the `password-hash` crate (a PHC-string API this
# module does not use — the low-level `hash_password_into_with_memory` is called directly, so the
# crate this workspace adds is one narrower than the crate's own quick-start example asks for) and
# chacha20poly1305's default set pulls in its own `getrandom` feature, which would be a second road
# to entropy beside the one [`KeyPair::generate`] already uses (`getrandom::fill`, above). `alloc`
# is the one feature each needs: argon2's memory-block buffer and chacha20poly1305's `Vec`-returning
# `Aead::encrypt`/`decrypt`.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

# 🔴 A wasm-target fix, from an earlier build-repair batch. Since 0.3,
# getrandom refuses to guess a backend on `wasm32-unknown-unknown` and fails the build with the
# message naming this feature. The feature is declared **per target**, so it is resolved only when
# that target is being built: the x86_64 graph is byte-identical and the external package count does
# not move (getrandom 0.3.4 is already in the tree, above, for `KeyPair::from_seed`'s entropy).
#
# The feature is half of getrandom's contract and `.cargo/config.toml` carries the other half
# (`--cfg getrandom_backend="wasm_js"`); either alone still fails to compile, which is why the two
# edits are one change. Measured before and after: the wasm build's return code went from failing to
# passing.
#
# This is a **build**, not an implementation of the WASM verifier -- that belongs to a later phase.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.11"                     # two acceptance criteria are stated as unit+property / property
