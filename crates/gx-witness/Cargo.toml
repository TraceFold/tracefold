# Provenance, evidence and the signed receipt. 41 §2 gives this crate its module list
# (`src/{lib,provenance,receipt,evidence,dsse,keys}.rs`) and its dependency line (`ed25519-dalek`);
# 42 §3.7 / §3.9 / §3.10 give the field tables those modules carry.
[package]
name = "gx-witness"
description = "Provenance, evidence and DSSE-signed receipts (41 §2 / 42 §3.9-§3.10)."
version = "0.1.0"
edition = "2021"
rust-version.workspace = true         # 卓-1 採 (req/38 §47): 宣言は workspace に 1 度だけ
license = "Apache-2.0"                # 35 DR-5, DEFAULT column

# The edge that E-M2-1 made one-way (`req/38_ERRATA_2026-08-07.md` §8). This crate names gx-core
# and gx-log names gx-core; neither names the other, so the cycle 42 §3.10 + §3.11 would have
# produced is absent from the graph rather than forbidden by a convention. gx-canon is NOT here:
# hand 1 needs no canonical encoding, and a dependency declared before its first use cannot be
# reviewed against a reason. Hand 4 adds it when `Provenance` first needs a CID.
#
# `version` beside `path`: see gx-canon's manifest for why (M2 hand 6, `cargo deny check bans`).
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.0" }

# Hand 4. 42 §1.3 gives `Evidence` an IdentityView row (全フィールド・除外なし), so the type needs a
# CID, and 41 §6 routes every canonical encode through gx-canon: `IdentityView` is declared there,
# and `cid::compute` is the only road to a digest (AC-014). Declaring the edge here is what lets
# `evidence.rs` implement the trait for a local type without gx-witness ever naming BLAKE3 or a CBOR
# codec -- `tests/evidence_cid.rs` reads the source and fails if it does. No cycle: gx-canon names
# gx-core and nothing else in this workspace.
gx-canon = { path = "../gx-canon", version = "0.1.0" }

# Hand 5. AC-070 verifies a `CommitReceipt`'s inclusion proof offline and H3-7
# (`req/38_ERRATA_2026-08-07.md` §12) attaches a signature over `gx_log::proof::
# checkpoint_signing_bytes`; both are gx-log's arithmetic, and a second copy of a merkle verifier is
# the drift E-M2-12 moved the `Proof` family down to gx-core to avoid. The edge runs one way --
# gx-log does not name this crate -- so E-M2-1's cycle is still absent from the graph and cargo, not
# a convention, is what says so. `tests/ac_018.rs` reads gx-log's manifest and fails if that ever
# changes. Raised in req/54 §4: 41 §2's informal dep line for gx-witness names neither this nor
# gx-canon.
gx-log = { path = "../gx-log", version = "0.1.0" }

# Named on this crate's dependency line in 41 §2 and approved in research/02 §3 by E-M2-10.
# Versions are the max_stable_version read off the crates.io API on 2026-08-07; every license was
# checked at three points (crates.io API, GitHub API, LICENSE file in the repository) and written
# into Desktop/GitRepo/REFERENCES.md the same day (R-10 / T-36).
#
# 3.0.0 declares rust-version 1.85, which is exactly this workspace's floor -- so a future patch
# release that raises its MSRV raises ours. `--locked` in CI pins what was reviewed; 2.2.0 (MSRV
# 1.81) is the fallback if that floor ever moves before ours does. Recorded in req/50 §5.
ed25519-dalek = "3"                   # FR-018/FR-019/FR-020, DSSE signature and verification

# base64 is NOT here. Hand 1 declared `base64 = "0.23"` for 44 §2.2's 「`payload`はbase64」 and
# req/50 §5 re-opened the version at first use rather than at declaration, because the release was
# published three days earlier and had not soaked. Hand 5 is that first use and takes the other
# branch: `gx_core::b64` writes RFC 4648 §4 out longhand, next to the base32 table 42 §1.2 already
# made gx-core write for `Cid` -- one crate, one place where an alphabet lives, and 41 §2's
# 「serde, thiserror 程度」 respected on the crate that would otherwise have taken the dependency.
# `gx-core/tests/base64_vectors.rs` checks the table against RFC 4648 §10's own vectors, and the
# package leaves the dependency tree with the declaration.

# Ed25519 seeds. `SigningKey::generate` needs ed25519-dalek's `rand_core` feature, which is off by
# default and would pull `rand_core` 0.10 into the graph for one call; `KeyPair::from_seed` takes the
# thirty-two bytes and this fills them. Already in the tree (0.3.4).
getrandom = "0.3"                     # FR-020, key generation

# 41 §6: 「エラーは thiserror で型化」. serde carries every field table in 42.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# 42 §3.7 types `InTotoStatementRef.inline` as `Option<serde_json::Value>`, so the field table puts
# this crate in the dependency rather than the dev-dependency column. Already in the graph: gx-canon
# carries it for `Intent.goal` (42 §3.3) under A-6, so hand 4 adds no package to the tree.
serde_json = "1"

# 🔴 **M6H7-5 (b)** (req/38 §54; implemented by the M6 fix batch's confirmed item 2). Since 0.3,
# getrandom refuses to guess a backend on `wasm32-unknown-unknown` and fails the build with the
# message naming this feature. The feature is declared **per target**, so it is resolved only when
# that target is being built: the x86_64 graph is byte-identical and the external package count does
# not move (getrandom 0.3.4 is already in the tree, above, for `KeyPair::from_seed`'s entropy).
#
# The feature is half of getrandom's contract and `.cargo/config.toml` carries the other half
# (`--cfg getrandom_backend="wasm_js"`); either alone still fails to compile, which is why the two
# edits are one change. Measured before and after: `WASM_gx-witness_RC=101` → `0`.
#
# This is a **build**, not an implementation of the WASM verifier — 46 §5 and N-03 are M7's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.11"                     # AC-015 is stated as unit + property, AC-019 as a property (34)
