# The shared contract harness the architecture spec requires of every `SubstrateAdapter`, added by
# an erratum that puts it in the crate table:
# "member count 6->9 (gx-substrate/gx-adapter-fs/gx-substrate-conformance); conformance is **not a
# publish target** (the probe-bin precedent); a note that it is a **different thing** from
# a separate, later-planned `gx-conformance-gen` tool" (sem: SEM-gx-substrate-conformance-001).
#
# The architecture spec, verbatim (sem: SEM-gx-substrate-conformance-002): "implement, as an
# adapter-independent shared test harness `gx-substrate-conformance` (a new test-only crate), the
# contract every adapter implementing the `SubstrateAdapter` trait (fs, git, mcp, and future
# additions) must satisfy. Each adapter crate inherits the contract tests merely by calling this
# harness from `#[test]`."
[package]
name = "gx-substrate-conformance"
description = "The adapter contract harness: seven contracts and the laws the rulings added."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the
                                       # workspace, per the adopted MSRV decision (sem: SEM-gx-substrate-conformance-003)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice

# **Not published.** The publish-target erratum, verbatim (sem: SEM-gx-substrate-conformance-004):
# "conformance is not a publish target (the probe-bin precedent)". This crate is a
# test instrument: it holds no product code, and a released version of it would be a second
# published surface whose compatibility promises nobody has made. `probes/doubt` carries the same
# line for the same reason.
publish = false

# The harness calls the seven methods and folds their answers, so it needs the boundary and the
# vocabulary those answers are in -- and nothing else. It does **not** depend on gx-canon: the
# library never takes a digest, because a shared harness that hashed anything would be deciding what
# an adapter's products mean. gx-canon is a dev-dependency instead, for the mock in `tests/support`,
# which mints its own snapshot ids the way any adapter has to.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2", package = "tracefold-core" }
gx-substrate = { path = "../gx-substrate", version = "0.1.2", package = "tracefold-substrate" }

[dev-dependencies]
gx-canon = { path = "../gx-canon", version = "0.1.2", package = "tracefold-canon" }
