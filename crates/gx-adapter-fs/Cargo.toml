# The first real `SubstrateAdapter`. The architecture spec gives this crate one line -- "gx-adapter-fs/ # dep:
# landlock (sandboxed at apply time, v0.2+)" -- and an erratum reads the rest of it:
# "`gx-adapter-fs # dep: 0 (landlock is v0.2+)`" (sem: SEM-gx-adapter-fs-001).
#
# `kind`/`snapshot`/`plan`/`precondition` were built first; `apply`/`invert` and `commutation`
# followed in later hands. A ruling keeps landlock out of v0.1 entirely.
[package]
# 🔴 registry rename (req/1032 §5 point 1 -> LOOP_STATE #312, 2026-09-01): publish name becomes
# "tracefold-adapter-fs"; [lib] name stays "gx_adapter_fs" so no source line changes anywhere.
name = "tracefold-adapter-fs"
description = "The filesystem SubstrateAdapter: single-file whole replacement, lexical locators."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-adapter-fs-002)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
repository.workspace = true           # crates.io metadata; also read by `dist generate`
publish = true                        # req/1032/req/1035 blockers resolved -- this crate is a real publish target now
readme = "README.md"                  # crates.io page body (2026-09-01, this lane: metadata completeness check)
keywords = ["agent-safety", "reversibility", "provenance", "verification"]

[lib]
name = "gx_adapter_fs"

# **Zero external dependencies**, in the sense the erratum trail means by "zero dependencies": the
# three entries below are workspace members and `serde` is already resolved by every one of them, so
# the external package count does not move (sem: SEM-gx-adapter-fs-003).
#
# gx-canon is here rather than in a dev-dependency because the payload of an fs delta is canonical
# DAG-CBOR and the architecture spec admits exactly one encoder: a ruling keeps this
# adapter from writing a parser of its own -- "the fs delta's payload is canonical DAG-CBOR, so it is within
# `fuzz_dagcbor_decode`'s existing reach -- it would be a different matter if the adapter wrote its own parser" (sem: SEM-gx-adapter-fs-004).
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2", package = "tracefold-core" }
gx-canon = { path = "../gx-canon", version = "0.1.2", package = "tracefold-canon" }
gx-substrate = { path = "../gx-substrate", version = "0.1.2", package = "tracefold-substrate" }

serde = { version = "1", features = ["derive"] }  # the fs delta's field grammar

# The shared contract harness the architecture spec requires, which an adapter crate calls from one
# `#[test]` ("each adapter crate only calls this harness from one `#[test]` to inherit the contract
# tests"). proptest is one acceptance criterion's property and another's judgment method
# ("unit + property"); both are already (sem: SEM-gx-adapter-fs-005)
# in the graph.
#
# A ruling puts one acceptance criterion's integration test here rather than in the gate's own
# suite: "that integration test goes in gx-adapter-fs's tests, with **gx-gate as a dev-dependency**
# (precedent set elsewhere, no cycle)". The gate half checks `invert_available=false → Escalate`
# and the adapter half returns `Ok(None)`; what had never run is the join. A dev-dependency reaches
# no shipped graph (`cargo tree -e normal` does not see it) and adds no package -- gx-gate is a
# workspace member and everything it resolves is already in the graph (sem: SEM-gx-adapter-fs-006).
[dev-dependencies]
gx-gate = { path = "../gx-gate", version = "0.1.2", package = "tracefold-gate" }
# 🔴 `gx-substrate-conformance` is explicitly not a publish target (its own manifest, "conformance is
# not a publish target -- the probe-bin precedent") and is not renamed. `version` intentionally
# dropped here (deny.toml's `allow-wildcard-paths = true` means a bare path dev-dependency is not a
# `cargo deny check bans` wildcard violation): with only `path` and no `version`, `cargo package`
# strips this line from the *published* manifest entirely (Cargo's documented dev-dependency
# behaviour), which is what a real `cargo publish` of tracefold-adapter-fs needs -- with `version`
# present, publishing would try to resolve `gx-substrate-conformance` against the real registry and
# fail (it will never be there). Local `cargo test -p gx-adapter-fs` is unaffected: the path still
# resolves inside this workspace's own Cargo.lock either way.
gx-substrate-conformance = { path = "../gx-substrate-conformance" }
proptest = "1.11"

# 🔴 `tests/pack_locators.rs` reads `policies/fs/scenarios.json`, the
# shipped artifact itself rather than a Rust copy of it, so the pack format is measured on what a
# third party would install. Precedent and wording are `gx-adapter-postgres`'s, which reads its own
# pack's scenario file the same way for the same clause.
#
# This does not move the "zero external dependencies" claim at the top of this file: that claim is
# about the package count on the normal graph, a dev-dependency cannot reach
# `cargo tree -e normal`, and serde_json is already resolved by gx-gate — which is a dev-dependency
# of this crate two lines above.
serde_json = "1"
