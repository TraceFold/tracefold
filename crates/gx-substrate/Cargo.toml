# The substrate boundary. The architecture spec gives this crate its module list
# (`src/{lib,adapter,delta,fingerprint}.rs`) and calls it "the point that secures" one of its core
# invariants (sem:
# SEM-gx-substrate-001); it also gives it the
# `SubstrateAdapter` trait and the delta tables `delta.rs` carries.
#
# An early hand created the crate and the data skeleton only. The trait itself, the
# conformance harness, and `gx-adapter-fs` followed in later hands.
[package]
name = "gx-substrate"
description = "The SubstrateAdapter boundary and its delta types."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the
                                       # workspace, per the adopted MSRV decision (sem: SEM-gx-substrate-002)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish

# An erratum fixed the architecture spec's missing dependency line:
# "`gx-substrate # dep: gx-core, gx-canon` (the minting of `ObjectSnapshot.id`/`DeltaRef.cid`)" (sem:
# SEM-gx-substrate-003). An early hand declared half of it and said why the other half was not there yet, on
# the rule gx-witness set and gx-gate followed for three hands -- "a dependency declared before its
# first use cannot be reviewed against a reason". **A later hand mints the first CID**:
# `PlannedDelta::new` now projects through `IdentityView` and mints its own `DeltaRef`, a ruling
# adopted, so the gx-canon
# edge has a call site and the erratum is complete.
#
# `thiserror` arrives with a later ruling and the same spec's "errors are typed with thiserror"
# (sem: SEM-gx-substrate-004): this crate now declares its own `Error`, because gx-core's ten
# variants are all rejected arguments and an adapter has to be able to say "could not be read". It
# adds no package to the graph -- every other member already depends on it -- which is the sense
# a ruling fixed for "zero new dependencies".
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2" }
gx-canon = { path = "../gx-canon", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }  # the IdentityView projections
thiserror = "2"                       # the architecture spec, "errors are typed with thiserror" (sem:
                                       # SEM-gx-substrate-005)
