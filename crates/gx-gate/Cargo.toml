# The admissibility predicate. The architecture spec gives this crate its module list
# (`src/{lib,policy,invariant,verdict,packs/}.rs`) and its dependency line (`cedar-policy`);
# the field-table spec gives the field tables `verdict.rs` and `policy.rs` carry.
[package]
# 🔴 registry rename (req/1032 §5 point 1 -> LOOP_STATE #312, 2026-09-01): this is the crates.io
# publish shape (default = [], no postgres pack -- matches the public GitHub mirror shape, chosen
# for consistency across the two public surfaces rather than shipping a third shape; the private
# `crates/gx-gate/Cargo.toml` with `default = ["pg"]` stays the internal-dev shape and is not
# published). [lib] name stays "gx_gate" so no source line changes.
name = "tracefold-gate"
description = "Cedar policy evaluation, invariant registry and verdict composition."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-gate-001) -- see the cedar-policy block below
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
repository.workspace = true           # crates.io metadata
publish = true                        # req/1032/req/1035 blockers resolved -- this is the real crates.io publish target for gx-gate
readme = "README.md"                  # crates.io page body -- resolves to crates/gx-gate/README.md once this manifest is swapped in for publish (2026-09-01, this lane: metadata completeness check)
keywords = ["agent-safety", "reversibility", "provenance", "verification"]

[lib]
name = "gx_gate"

# The direction of every edge here is fixed by two early rulings and checked by cargo rather than by
# a convention. One erratum puts the opaque `PlannedDeltaBytes` in gx-core (a later hand supplies the
# meaning), and another puts `VerdictKind` there too -- so gx-witness can type its receipt's
# discriminant without naming this crate. That matters because the edge runs the other way:
# `GateInput.evidence` is `&[Evidence]` (per the architecture spec's acceptance criteria), so
# **gx-gate names gx-witness**. Had `VerdictKind` stayed where the field-table spec files it, the two
# crates would have had to name each other -- the one-way-edge ruling's cycle a second time.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
# 🔴 **The postgres pack is a build-time embedding, so only a feature can
# remove it.** `src/packs.rs` reaches `policies/postgres/deny-system-catalogs.cedar` with
# `include_str!`, and the public distribution does not ship that directory (its `policies/` is
# `fs`, `git`, `mcp` — measured on the clone). `include_str!` runs before any
# feature does *in the crate that writes it*, which is why the feature work one crate up
# (`gx-cli`'s `pg`) could not reach it: the embedding has to be gated **here**, where it is written.
#
# `default = ["pg"]` keeps the private tree exactly as it was — four packs, four rows, every
# existing count unchanged. `public/crates/gx-gate/Cargo.toml` ships the same Rust with
# `default = []`, which is the two-manifest pattern established for `gx-cli`,
# extended one crate down. The feature gates **both** the embedding and its `SHIPPED_PACKS` row,
# because gating only the first would leave the table naming a pack no build carries, and gating
# only the second would still fail to compile.
# 🔴 **Off in the public distribution, and this is the whole point of the file.**
#
# `crates/gx-gate/src/packs.rs` embeds the postgres pack with `include_str!`, and this distribution's
# `policies/` directory is three files (`fs`, `git`, `mcp`) — the postgres pack is not in the sync
# set. An `include_str!` naming a file that is not in the tree is a **compile error before any Rust
# is read**, which is exactly what the published repository did on every `cargo build --workspace`
# (measured on an anonymous clone). No feature on a *dependent* crate can reach it,
# because the embedding is resolved while this crate compiles.
#
# So this manifest ships the same Rust with the feature off. Three packs embedded, three rows in
# `SHIPPED_PACKS`, three adapters registered by `gx-cli` — the public tree stays self-consistent
# rather than merely compiling, which is the property `crates/gx-cli/tests/defaults.rs` checks.
#
# Turning `pg` on here will not work: the pack file is not in this tree and the build will say so by
# name. That refusal is the intended answer, and it is the same posture `public/crates/gx-cli/
# Cargo.toml` takes for `mcp`, `confine` and its own `pg`.
[features]
default = []
# The shipped postgres pack and its `SHIPPED_PACKS` row.
pg = []  # needs `policies/postgres/deny-system-catalogs.cedar`, not in this distribution

[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2", package = "tracefold-core" }
gx-witness = { path = "../gx-witness", version = "0.1.2", package = "tracefold-witness" }

# Earlier hands wrote here that gx-canon was NOT a dependency, on gx-witness's rule -- "a dependency
# declared before its first use cannot be reviewed against a reason" -- and named the hand that
# would add it: "`TicketId` and `AdmitProof` will need a CID (the field-table spec gives both an
# IdentityView),
# and the hand that mints one is the hand that adds the edge". A later hand is that hand, and the
# reason
# is a ruling: "Deny=`Vec<Reason>`, Escalate=`EscalationTicket` takes a CID by an explicit
# rule". A `proof_digest` per verdict arm cannot be produced without computing a CID, and
# the architecture spec admits exactly one road to one -- "every canonical encode goes through gx-canon only" (sem: SEM-gx-gate-002) -- so the
# alternative to this line is a second encoder, which one acceptance criterion forbids by name.
#
# No package is added by it: gx-witness already depends on gx-canon, so the graph is unchanged
# (223 before and after, measured directly). What changes is that this crate now says out loud
# which digests it takes, rather than reaching them through a re-export.
gx-canon = { path = "../gx-canon", version = "0.1.2", package = "tracefold-canon" }

# The architecture spec's dependency line for this crate, and this workspace's DEFAULT license
# ruling. Measured before it was
# written down ("declare only after you've looked at the numbers" (sem: SEM-gx-gate-003)), and the
# numbers are recorded elsewhere: licence Apache-2.0 at three points (crates.io API,
# GitHub API, the LICENSE file in the repository), the package delta, `cargo deny check`, the
# duplicate subtrees and the declared MSRV.
#
# 🔴 **The declared MSRV does not fit.** cedar-policy declares `rust-version = "1.89"` in every
# release from 4.8.0 to 4.12.0 (crates.io API, read on 2026-08-08); this workspace declares 1.85 on
# the line above because the architecture spec does. The toolchain here is 1.97, so nothing fails to
# build -- what
# is wrong is the *declaration*: a reader on 1.85 cannot build this crate. Raising the spec's floor is
# Owner-only (sem: SEM-gx-gate-004), so this hand changes no `rust-version` anywhere and raises the
# conflict elsewhere instead. The dependency is declared because a later hand's acceptance criterion
# cannot start
# without it and because the measurement the ruling asks for has to be taken on a resolved graph.
#
# No `default-features = false`. An early hand measured that turning the defaults off removes no
# package
# (223 either way: `datetime`, `decimal` and `ipaddr` are internal extension types that pull nothing
# in), and a later hand -- which has the call site -- keeps them on for a reason of meaning rather
# than of
# size: the three features decide whether a policy may write `ip("10.0.0.0/8")` or `datetime(...)`,
# so switching them off would silently make some third-party policy pack fail to parse. A narrowing
# with no measurable benefit and an invisible cost is not a narrowing.
cedar-policy = "4.12"

# The architecture spec: "errors are typed with thiserror" (sem: SEM-gx-gate-005). serde carries the field-table spec's tables.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Test-only, and the same version gx-core already resolves, so the graph does not move: the testing
# spec asks
# for "≥1000 cases/PR" on properties (sem: SEM-gx-gate-006), and this crate's property is that a
# policy set's answer to a
# request is a function of the two (`tests/policy_determinism.rs`).
[dev-dependencies]
proptest = "1.11"

# A later hand's false-admit vectors are JSON files, read at test time. The family a design note
# defines keeps
# its vectors as data "readable without depending on a generator script" (sem: SEM-gx-gate-007), which is how gx-canon's negative vectors
# are already carried -- so this is the same shape one layer up, and the reader of a vector needs no
# Rust to read it.
#
# It adds no package: gx-canon already resolves serde_json, so the graph is the same 223 it was
# before criterion (measured directly).
serde_json = "1"

# One acceptance criterion's instrument, named by the requirements spec and the benchmark spec. A
# ruling approves it the standard way ("criterion follows
# the approved method: a research addendum + 5 pre-adoption measurements + **feature selection, defaulting to a configuration that pulls in no plotters family**") (sem: SEM-gx-gate-008),
# and the five measurements are recorded elsewhere -- licence at three points, the package delta, `cargo
# deny check`, the duplicate subtrees, and the declared MSRV.
#
# `default-features = false` is the ruling's feature clause, and the primary is what it is read
# against: criterion's own Cargo.toml declares `default = ["rayon", "plotters", "cargo_bench_support",
# "alloca"]` (criterion-rs/criterion.rs, master, read 2026-08-08). Turning the defaults off and
# naming `cargo_bench_support` keeps the one feature that makes a bench runnable by `cargo bench`
# and drops the plotting stack, the thread pool and the stack randomiser -- none of which a recorded
# median needs. What that costs is the HTML report, which no gate reads.
#
# 🔴 The declared MSRV does not fit, the same way cedar-policy's does not: criterion declares
# `rust-version = "1.86"` for every 0.8.x and this workspace declares 1.85 because the architecture
# spec does. The
# toolchain here is 1.97 and nothing fails to build; the declaration is what is wrong, and raising
# the spec's floor is Owner-only (sem: SEM-gx-gate-009). cedar's 1.89 is the binding one of the two.
#
# Test-only in the strict sense: a dev-dependency cannot reach `cargo tree -e normal`, so nothing
# criterion pulls in is in anything gx ships.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# The benchmark spec names the file and one acceptance criterion names it again. `harness = false`
# because criterion supplies its
# own main (this one also runs the per-call instrument the percentile of one performance requirement
# needs -- see the
# file's own note on why criterion's estimator is not that instrument).
[[bench]]
name = "verify_latency"
harness = false
