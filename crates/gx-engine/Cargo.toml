# The state machine and commit protocol the architecture spec defines. The same spec gives this
# crate its module list
# (`src/{lib,pipeline,store,replay}.rs`) and its one-line remit "the executable body of the state
# machine, the CAS commit protocol" (quoted in SEM-gx-engine-001); the field-table spec files
# `EscrowedInverse`,
# `InverseStatus` and `EngineJournalRecord` under
# `store.rs`/`replay.rs`.
#
# An early hand creates the crate, the journal and the escrow types only. **No transition is
# implemented** ("not one transition is implemented", quoted in SEM-gx-engine-002)
# -- `pipeline.rs` is a later hand's file and
# is deliberately absent, because a module that exists and does nothing is a module a reader has to
# rule out.
[package]
name = "gx-engine"
description = "The Transformation lifecycle: engine journal, escrow store, deterministic replay."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-engine-003)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish
repository.workspace = true           # `dist generate` reads this

# 🔴 A standing invariant is a claim about this table: no substrate adapter is here, and none may
# be. The architecture spec puts the substrate behind the adapter boundary, and an engine that linked
# `gx-adapter-fs` would ship one substrate's grammar to every user of every substrate --
# breaking this turns "the same engine no matter the substrate" into a lie in the implementation
# (quoted in SEM-gx-engine-004). The mechanical check is
# `probes/doubt/tests/workspace_doubt.rs::gx_engine_ships_no_substrate_adapter`, which reads this
# section and not the whole file, plus `cargo tree -p gx-engine -e normal` in tools/verify_m5h1.sh.
#
# **The dependency shape's six, complete as of an early hand.** The architecture spec writes the
# dependency shape as six -- "gx-engine
# depends on exactly six: gx-core / gx-canon / gx-witness / gx-log / gx-gate / gx-substrate" (quoted
# in SEM-gx-engine-005) -- and
# an erratum files that as the correction. An early hand declared four and raised a review flag,
# because a dependency declared before its first use cannot be reviewed against a reason (the rule
# gx-substrate set in an early hand, accepted once an earlier erratum was called complete only after
# a later hand minted the first CID). A ruling was adopted -- "a shipping dependency is **declared in
# the hand where a call exists**...gx-gate is added in one hand, gx-witness in a later one" (quoted
# in SEM-gx-engine-006)
# -- and both call sites arrive here rather than one:
#
#   * `gx-gate`    -- `Gate::verify`, exactly where the ruling put it.
#   * `gx-witness` -- **one hand earlier than the ruling expected.** `Receipt::issue` is still a
#                     later hand's, but an earlier ruling (sem: SEM-gx-engine-007) types
#                     `EvidenceSource::collect` as returning
#                     `Vec<Evidence>`, and `Evidence` is gx-witness's. A type in a public
#                     signature is a use, so the reason exists now and the ruling's condition
#                     ("in the hand where a call exists", quoted in SEM-gx-engine-008) is met early rather than bent.
#
# So the six are complete and **fs is still none of them**: the erratum's content is unchanged.
# `external` package count is unaffected -- both are workspace members already in the graph.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2" }        # every id, `Timestamp`, `AbortReason`, `VerdictKind`, and its two-axis verdict shape
gx-canon = { path = "../gx-canon", version = "0.1.2" }      # the architecture spec: "every canonical encode goes through gx-canon only, no detour" (quoted in SEM-gx-engine-009)
gx-substrate = { path = "../gx-substrate", version = "0.1.2" } # `PlannedDelta`, the body an escrowed inverse holds
gx-log = { path = "../gx-log", version = "0.1.2" }          # `Recovery`: one spelling of "what opening an append-only file found" (sem: SEM-gx-engine-009)
gx-gate = { path = "../gx-gate", version = "0.1.2" }        # `Gate::verify`, returning a `Result<Verdict>`
gx-witness = { path = "../gx-witness", version = "0.1.2" }  # `Evidence`: what an `EvidenceSource` returns

serde = { version = "1", features = ["derive"] }  # the journal's canonical form
thiserror = "2"                       # the architecture spec, "errors are typed with thiserror" (sem: SEM-gx-engine-010)

# One acceptance criterion asks the two-stage identity to hold across "a fully independent separate
# process" (quoted
# in SEM-gx-engine-010), so a second binary
# has to exist. Gated exactly the way gx-canon gates its own probe-binary criterion (an established
# precedent):
# off by default, so `cargo build`, `cargo install` and `cargo package` never see it, and turned on
# only by this package's own dev-dependency below -- which is what makes `cargo test` build it and
# export `CARGO_BIN_EXE_engine_id_probe`.
[features]
probe-bin = []

[[bin]]
name = "engine_id_probe"
path = "tests/bin/engine_id_probe.rs"
required-features = ["probe-bin"]

# 🔴 A ruling asks for crash recovery to be measured "with a real
# binary, a real process" (quoted in SEM-gx-engine-011), and `gx-cli` belongs to a later phase. So the
# real binary is this one, behind the same
# gate as the two-stage-identity probe: `cargo build`, `cargo install` and `cargo package` never
# build it, and `cargo test` does because the dev-dependency below turns the feature on. That same
# ruling's own sentence
# ("a test-only hook, or an injection-point environment variable", quoted in SEM-gx-engine-012)
# permits a hook inside the engine instead; the
# injection points live in this binary's adapter so that no shipping line reads an environment
# variable.
[[bin]]
name = "crash_probe"
path = "tests/bin/crash_probe.rs"
required-features = ["probe-bin"]

[dev-dependencies]
proptest = "1.11"                     # the journal round-trip is stated as a property (sem: SEM-gx-engine-013)
gx-engine = { path = ".", features = ["probe-bin"] }  # turns the probe binary on for `cargo test` alone

# 🔴 **No adapter in the shipping graph -- and, from a later hand, one here.**
#
# Earlier hands declared none at all: `ENGINE_ADAPTER_DECLARATIONS=0` (an early measure, which counts
# *any* declaration in this file) stayed 0, and every suite drives the engine with a stub written
# against `SubstrateAdapter` in `tests/support/mod.rs`. Two reasons, and the second was the real one.
# A stub is the better instrument -- an engine test that failed because a real filesystem behaved
# unexpectedly would be measuring the adapter. And the no-substrate-adapter invariant is a claim about
# "the same engine no matter
# the substrate" (quoted in SEM-gx-engine-014): a hand that reaches for the fs adapter to make its own tests convenient is the first step
# of the drift the rule exists to stop.
#
# **One integration benchmark is not that hand.** Its Given is "**via the fs adapter**, a commit
# pipeline on tmpfs"
# (quoted in SEM-gx-engine-015) and its measurement column names the crate: "using
# `gx-adapter-fs` on tmpfs". A bench that measured a
# stub would print a number about `tests/support/mod.rs` under that requirement's name. So the
# adapter is here,
# **for the benches only**, and the no-substrate-adapter invariant is untouched where it is written:
#
#   * `cargo tree -p gx-engine -e normal` shows no adapter (`ENGINE_SHIPPED_ADAPTERS=0`);
#   * `probes/doubt/tests/workspace_doubt.rs::gx_engine_ships_no_substrate_adapter` reads the
#     `[dependencies]` section above and finds none -- that probe's own note has said since its
#     first hand
#     that "`[dev-dependencies]` is deliberately outside it: a test may drive the engine with a real
#     adapter, and doing so is how later hands will show that the boundary holds"
#     (quoted in SEM-gx-engine-016);
#   * `crates/gx-engine/tests/engine_shape.rs::no_source_line_names_an_adapter` scans `src/` and finds
#     none -- benches are not `src/`, and a bench is not in a published artefact either.
#
# What **does** move is an early hand's stricter reading of its own instrument ("not even a
# dev-dependency", quoted in SEM-gx-engine-017).
# `ENGINE_ADAPTER_DECLARATIONS` goes 0 -> 1 and a later hand reports it as a change rather than
# re-scoping the number quietly. No package is added to the graph: `gx-adapter-fs` is
# already a workspace member and already resolved.
#
# 🔴 Written in the **inline** form, on a line that begins `gx-adapter-fs =`, on purpose. A
# `[dev-dependencies.gx-adapter-fs]` table would declare exactly the same dependency and would be
# **invisible** to the early grep-based instrument (`^gx-adapter[a-z-]* *=`), so the instrument
# would keep printing 0
# while the dependency was there. Changing the spelling to keep a number is the failure a standing
# ledger warns about; the number moves and the report says why.
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.2" }

# Three acceptance criteria's instrument, named ("gx-engine's integration bench" / "bench (load test)" /
# "bench (recovery benchmark)", quoted in SEM-gx-engine-018), which files all three under this crate by name.
#
# The feature list is **the same one gx-gate resolved in an earlier hand** and that is deliberate:
# cargo unifies features across the graph, so a second spelling here would turn criterion's defaults
# (`rayon`, `plotters`, `alloca`) back on for both crates and move the external package count. A
# ruling is the clause -- "feature selection (default to a configuration that does not pull in the
# plotters family)" (quoted in SEM-gx-engine-019) -- and a research note carries the
# five measurements that approved the crate. `cargo_bench_support` is the one feature that makes a
# bench runnable by `cargo bench`; what it costs is the HTML report, which no gate reads.
#
# Test-only in the strict sense: a dev-dependency cannot reach `cargo tree -e normal`.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# The benchmark spec names all three files and the acceptance criteria again. `harness = false`
# because criterion
# supplies its own main -- and because each of these runs a **raw** instrument first, for the
# percentile its performance requirement is stated in (criterion samples batch means, and the p99 of
# batch means is not
# the p99 of calls). The raw half runs only under `cargo bench`, which is the flag that separates a
# measurement from `cargo test`'s check that the file still builds (one acceptance criterion's file
# carries the
# 23x unoptimised-profile measurement that made that guard necessary).
[[bench]]
name = "commit_pipeline"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "journal_recovery"
harness = false

# 🔴 A later ruling added the benchmark spec's **sixth** row, and the first one that did not
# already have a criterion. `journal_recovery` times the replay; this times
# `Engine::recover`, which re-applies through an adapter, appends to the ledger and issues receipts.
# The recovery-flow ledger: "the time to resume after a crash is the flight recorder's product
# promise itself" (quoted in SEM-gx-engine-020).
[[bench]]
name = "recover_cost"
harness = false

# 🔴 A ruling — "keep the existing firing condition and do not
# implement a lock -- add **commits/sec measurement over disjoint object groups**" (quoted
# in SEM-gx-engine-021). Three arms (1 engine in series / 1 engine + 1 Mutex across N threads / N
# engines across N threads), and the third is an **upper bound** on what a per-object lock could
# buy rather than an implementation of one — `src/` gains no lock and the spec gains no new
# vocabulary. The
# file's own header carries that disclosure beside the numbers.
[[bench]]
name = "disjoint_lock"
harness = false

# 🔴 (`gx-mcp-wire/Cargo.toml` carries an identical note): `engine_id_probe` and
# `crash_probe` are `probe-bin`-gated test fixtures, not shipped product. Opted out of `dist
# generate`'s default (every `[[bin]]` in the workspace) the same way. **At the end of the file, on
# purpose** — a `[package.metadata.dist]` table earlier in this manifest silently swallowed the
# `gx-adapter-fs`/`criterion` dev-dependency lines that followed it into itself (both are
# free-form key = value tables and TOML never complained), which cargo then resolved as though
# neither were declared -- found by `cargo clippy --all-features` failing two benches with
# `unresolved import`, not by re-reading this file.
[package.metadata.dist]
dist = false
