# The architecture spec's other new crate: "`gx-api/` — axum HTTP+JSONL stream" (sem: SEM-gx-api-001).
#
# 🔴 **An early hand implements the API spec's synchronous surface**: every endpoint except `GET
# /stream`, which a later hand builds together with `gx serve`'s runtime and three list endpoints.
# An earlier note calls that "the synchronous face, 11 endpoints" (sem: SEM-gx-api-002) and the spec
# has **fourteen** rows, of which thirteen are
# not `/stream` — the discrepancy is raised and the implementation follows the words
# ("everything except `/stream` and the list family").
[package]
name = "gx-api"
description = "The Glovrex HTTP surface: thirteen synchronous endpoints, the gx_code map, Bearer auth and Idempotency-Key."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-api-003)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish

# 🔴 **A house rule** applies to this table exactly as it applies to gx-cli's: `gx-canon` is
# absent and may not be added. A design note wrote the same rule about the Console — "TS itself never
# holds verification logic (a secondary language holds none of Glovrex's semantic authority')" (sem:
# SEM-gx-api-004) — and this rule is
# that principle's form **inside** the primary language. `crates/gx-canon/tests/authority_boundary.rs`
# reads this file and the source below it.
#
# 🔴 **`gx-cli` is absent and must stay absent, and the reason is a cycle.** The distribution spec
# makes the v0.1
# artefact "a single static binary (`gx-cli` folds `gx-api`'s functions in via `gx serve`)" (sem: SEM-gx-api-005), so a later hand adds
# `gx-api` to *gx-cli's* manifest. A dependency the other way would close the loop, and cargo
# refuses it. The consequence is structural rather than stylistic and shows up in `AppState`: this
# crate never spells `.gx/`, because the directory layout spec is gx-cli's declaration (one list, one
# probe — `m6_surface_doubt::the_dotgx_layout_is_req56_exactly`). The caller hands it two paths.
#
# 🔴 It also means one acceptance criterion cannot live here: comparing the CLI with the HTTP surface
# needs both, so
# the suite is `crates/gx-cli/tests/ac_055.rs` and `gx-api` is a **dev**-dependency of gx-cli under
# the same "declare where it is called" rule (sem: SEM-gx-api-006) that a later hand will promote.
#
# ---------------------------------------------------------------------------
# The dependency measurement, before the declaration
# ---------------------------------------------------------------------------
#
# `axum` was measured and declared by an early hand (+29 packages, licences inside deny.toml's
# allow list, subtree MSRV 1.80). What this hand adds:
#
#   * `chrono` — a ruling decided "the RFC 3339 conversion is decided by a five-point measurement of `time`/`chrono`" (sem: SEM-gx-api-007).
#     The API spec is normative — "date-times are RFC 3339 … the conversion from the internal `Timestamp`
#     (a nanosecond epoch) is **the API layer's responsibility**" (sem: SEM-gx-api-008) — and this is the API layer. The five points, measured in a scratch package with this
#     repository's manifest untouched (`tools/m6h5_dep_probe.sh`):
#       - **packages: +0**. `chrono 0.4.45` is already in the shipping closure —
#         `cargo tree -e normal -i chrono` shows `chrono → cedar-policy-core → cedar-policy →
#         gx-gate → {gx-cli, gx-engine}` — so `cargo metadata` and `Cargo.lock` do not move.
#       - **licences**: `MIT OR Apache-2.0`; `cargo deny check licenses` RC=0, allow list unchanged.
#       - **rust-version**: subtree max **1.82**, inside this workspace's 1.89 MSRV declaration (sem: SEM-gx-api-009).
#       - **duplicate roots**: `cargo tree -e normal -d` empty.
#       - **subtree**: 31 packages, every one already resolved.
#     🔴 The alternative was `time 0.3.55`, which is in `Cargo.lock` and in **no build graph**
#     (`cargo tree -e normal -i time` prints nothing): adopting it would have added **12** packages
#     to the shipping closure for a smaller subtree. Cheaper on paper, more expensive here.
#     🔴 **The 0 is borrowed.** It is cedar-policy-core's dependency, not ours; the day cedar drops
#     `chrono` the number becomes 31. Firing condition, in the report and here: **re-measure when
#     cedar's dependency set changes**, and `time` is the fallback that was already priced.
#   * `default-features = false` is a house rule (sem: SEM-gx-api-010), not thrift. chrono's default
#     `clock` feature is what
#     provides `Utc::now()`, and the architecture spec puts the clock at the engine boundary -- a
#     measurement confirms that
#     gx-cli reads the wall clock in exactly one place. A formatting-only chrono cannot be a second
#     clock, so the absence is structural rather than a rule somebody has to remember.
#   * 🔴 **`tokio`** and **`futures-core`** — a later hand, under the same "declare where it is called" (sem: SEM-gx-api-011)
#     rule. `gx serve`'s runtime is `crates/gx-api/src/serve.rs`, which is where
#     the architecture spec puts it (the verb is gx-cli's, the axum surface is this crate's), and
#     `GET /stream` needs a body that is a `Stream`. The five points, measured before declaring
#     (`tools/m6h6_dep_probe.sh`):
#       - 🔴 **packages: +1**, and the +1 is the one this hand did not expect. `tokio 1.53.1` and
#         `futures-core 0.3.33` are themselves already resolved (both arrive inside axum's own tree
#         and both were dev-dependencies here), but the **`signal` feature** pulls
#         `signal-hook-registry 1.4.8`, which nothing in this workspace had. Measured, not assumed:
#         `Cargo.lock` 289 → **290**, external **277 → 278**. The declaration was written before the
#         measurement and said "+0 each"; the measurement corrected it, which is what the "don't
#         declare before the number" house rule is for, and the report records the correction rather
#         than the corrected text alone.
#         It is kept: without `signal` there is no `SIGTERM`, and without `SIGTERM` "graceful
#         shutdown" means "on Ctrl-C only" (sem: SEM-gx-api-013) — an init system's `systemctl stop` would reach the
#         process as a kill, which is the crash path a design note forbids spelling as a normal exit.
#       - **licences**: `MIT` (tokio), `MIT OR Apache-2.0` (futures-core and signal-hook-registry);
#         `cargo deny check licenses` RC=0 and `check bans` RC=0, allow list unchanged.
#       - **rust-version**: tokio 1.71, mio 1.71, signal-hook-registry 1.26 — all inside this
#         workspace's 1.89 MSRV declaration (sem: SEM-gx-api-014).
#       - **duplicate roots**: `cargo tree -e normal -d` unchanged from the base (10 lines, all
#         pre-existing; no new root).
#       - **subtree**: inside axum's, which was already priced at +29.
#     🔴 **The bigger number is the shipping closure of the `gx` binary**, because "what `Cargo.lock`
#     holds" and "what a third-party auditor installs" (sem: SEM-gx-api-015) are different questions (the same distinction drawn
#     for `chrono`). Measured with `tools/m6h6_dep_probe.sh`: **126 → 167 packages (+41)**,
#     against a verification core (`gx-canon`'s own closure) of **41**. So an auditor handed the
#     single static binary now installs four times the code the verification actually needs, and
#     the standing claim — "the distribution form doesn't change the amount of verification; what
#     changes is what it makes the verifier install" (sem: SEM-gx-api-016) — has its
#     number. A split `gx-verify` binary was registered as a future option, conditioned on "when an
#     end-to-end test finds dependency closure blocking third-party acceptance"
#     ; nobody has been blocked, so the condition has **not** fired, and the number is on
#     a standing ledger rather than acted on.
#     Features are named rather than `full`: `rt-multi-thread` and `net` for the server, `time` for
#     the deadline of shutdown stage 3, `signal` for SIGTERM, `sync` for the subscriber channel.
#     `macros` is **absent** — there is no `#[tokio::main]` here, because a runtime this crate builds
#     is a runtime gx-cli does not have to know about.
[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures-core = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync"] }

# The engine and the three layers whose refusals the API spec has to name. All **path**
# dependencies, so the external package count does not move.
#
# `gx-engine` — the eight entry points. 🔴 `Engine`'s entries take
#   `&mut self` (a ruling: "the engine holds no lock of its own; concurrency is the caller's responsibility"; sem: SEM-gx-api-017) and axum
#   wants `Send + Sync` state, and another ruling adopted one `Arc<Mutex<..>>`, every request
#   serialised —
#   with the per-object lock registered on a standing ledger against "when a benchmark run via serve
#   breaks the SLA
#   " (sem: SEM-gx-api-017). See `state.rs`.
# `gx-gate`   — `TicketId` for the API spec's id-resolution on the escalation endpoint, `HumanRuling`'s
#   vocabulary, and `Error::kind` for the map. **No `Verdict` is constructed here** (a house rule; sem: SEM-gx-api-018).
# `gx-witness`— `Receipt`, `KeyPair`, `Evidence`, and `dsse::sign_checkpoint` for
#   `GET /ledger/checkpoint` (a ruling: "the handler calls `unsigned_checkpoint` → `sign_checkpoint`"
#   ; sem: SEM-gx-api-019).
# `gx-log`    — `prove_inclusion` and `unsigned_checkpoint` for the two ledger endpoints.
# `gx-core`   — ids, `Cid::from_text` (the `gx1:` parser the API spec needs, and **not** a mint), `Intent`.
gx-core = { path = "../gx-core", version = "0.1.2" }
gx-engine = { path = "../gx-engine", version = "0.1.2" }
gx-gate = { path = "../gx-gate", version = "0.1.2" }
gx-witness = { path = "../gx-witness", version = "0.1.2" }
gx-log = { path = "../gx-log", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 🔴 The test client the architecture spec names: "an axum test client (equivalent to
# `tower::ServiceExt`) hits the same
# pipeline as the CLI and compares the response" (sem: SEM-gx-api-020). Both are **already resolved** through axum's own tree
# (`tower 0.5.3`, `tokio 1.53.1`) and the measurement above found **+0 packages** for each, so the
# suites cost nothing the binary was not already carrying. `tokio` is a dev-dependency here and
# becomes a shipping one in **a later hand**, which is the hand that writes `#[tokio::main]`.
[dev-dependencies]
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.2" }
# `macros` for `#[tokio::test]`, `rt-multi-thread` for the suites that drive a subscriber and a
# writer at the same time. `http-body-util` reads one frame of a streaming body without draining it,
# which is how `tests/stream.rs` observes a line arriving on a body that never ends; it is already in
# `Cargo.lock` through axum, so it costs no package either.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# 🔴 A ruling (sem: SEM-gx-api-021) — one performance requirement re-measured through this crate's
# surface (`benches/
# serve_throughput.rs`). The feature list is **the same spelling** gx-gate resolved in an earlier
# hand and
# gx-engine repeats, and that is deliberate: cargo unifies features across the graph, so a second
# spelling here would turn criterion's defaults (`rayon`, `plotters`, `alloca`) back on for all three
# crates and move the external package count. Measured before declaring
# (`tools/m6h7_dep_probe.sh`): `criterion 0.8` is already resolved in `Cargo.lock` through gx-gate and
# gx-engine, the feature set is identical, so **packages +0** and `cargo tree -e normal` is unmoved
# (a dev-dependency cannot reach it).
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# The benchmark spec's table gains no row for this file: the requirement's row already names
# "gx-engine/gx-cli" (sem: SEM-gx-api-022) and this is
# the same requirement measured through a second surface, which a ruling asked for by name. `harness =
# false` because criterion supplies its own main, and because the sixty-second load generator runs
# only under `--bench` (the flag that separates a measurement from `cargo test`'s check that the file
# still builds).
[[bench]]
name = "serve_throughput"
harness = false
