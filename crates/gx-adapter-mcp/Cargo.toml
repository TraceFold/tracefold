# The third real `SubstrateAdapter`, and the one an early roadmap note calls "**the actual body of
# a key design wedge**". (sem: SEM-gx-adapter-mcp-021)
# The functional-requirements spec, verbatim: "gx-adapter-mcp MUST implement a proxy that intercepts
# the MCP tool-call boundary (sem: SEM-gx-adapter-mcp-022)
# and candidates a tool-call intent into a `PlannedDelta`", (sem: SEM-gx-adapter-mcp-023)
# and one acceptance criterion is what is measured: "inspect at the **configuration level** whether a
# direct call path bypassing the proxy exists (sem: SEM-gx-adapter-mcp-024)
# ...and that no bypass route technically exists". (sem: SEM-gx-adapter-mcp-025)
#
# An early hand built all seven adapter methods, ratified afterward. (sem: SEM-gx-adapter-mcp-026)
[package]
name = "gx-adapter-mcp"
description = "The MCP SubstrateAdapter: a tool call that cannot reach a server except through an admitted apply."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace only, per the adopted MSRV decision (sem: SEM-gx-adapter-mcp-027)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish

# 🔴 **No external dependency, and that is the no-bypass acceptance criterion's doing rather than
# thrift.** The architecture spec's crate table
# writes `dep: gix (gitoxide)` on the git adapter's row and writes **nothing** on this one, so no
# implementation route is mandated here the way the git functional requirement mandates one there.
# What decides it is the acceptance criterion: "no bypass route technically exists" is a claim about
# the set of roads to the substrate, and a (sem: SEM-gx-adapter-mcp-028)
# linked MCP client library is a **second road** -- its own transport, reachable by anyone who can
# name the crate, with no `Admitted` in its signature. So the wire is the deployment's
# ([`transport::ToolTransport`]) and this crate holds the boundary, the grammar and the gate.
#
# What that costs is stated where a reader will find it (`src/lib.rs`, "What v0.1 does not close"): (sem: SEM-gx-adapter-mcp-029)
# **no JSON-RPC framing ships here**, so "the proxy speaks MCP" is not among the things this hand (sem: SEM-gx-adapter-mcp-030)
# measured. What it measured is that nothing in this workspace can call a tool without going through
# one admitted `apply`.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.2" }
gx-canon = { path = "../gx-canon", version = "0.1.2" }
gx-substrate = { path = "../gx-substrate", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }  # the delta's field grammar

# A later ruling narrowed the sentence above, and the narrowing is stated rather than the (sem: SEM-gx-adapter-mcp-031)
# sentence deleted: "no external dependency" was the acceptance criterion's refusal of a **linked MCP
# client library** (sem: SEM-gx-adapter-mcp-032)
# (a second road to the substrate), and neither line below is one -- no transport, no framing, no
# `Admitted`-free path to a server. `tests/ac_051.rs`'s two compile_fail doctests still hold with
# both in the graph.
#
# `serde_json`: a `RestoreTemplate` (catalogue.rs) reads the forward call's arguments and writes the
#   restore tool's -- both are UTF-8 JSON because that is what `gx wrap` stores and what
#   `tools/call` carries. Already in this workspace's graph (gx-mcp-wire, gx-cli).
# `sha1`: `ArgSource::GitBlobSha1OfForward` (catalogue.rs says why a git content address is the one
#   "the do-time return" an escrow built before `apply` can carry). RustCrypto's, MIT OR Apache-2.0, (sem: SEM-gx-adapter-mcp-033)
#   already in this workspace's lockfile through `gix` (gx-adapter-git). Not a security boundary:
#   the receipts' hash road stays gx-canon's (the architecture spec's rule).
serde_json = "1"
sha1 = "0.10"

# The shared contract harness the architecture spec requires, which an adapter crate calls from one
# `#[test]` ("each adapter crate inherits the contract tests merely by calling this harness from `#[test]`"). (sem: SEM-gx-adapter-mcp-034)
#
# 🔴 **`gx-engine` and `gx-gate` are here, and they are the no-bypass acceptance criterion's other
# half.** That criterion asks for two
# things and the second is "confirmed by an **integration test**" that "every tool call always passes
# through the submit->verify route". (sem: SEM-gx-adapter-mcp-035)
# A scan of this crate cannot say that: whether a tool call reaches a server *only* after a gate
# admitted it is a fact about the **pipeline**, and the pipeline is the engine's. So `tests/ac_051.rs`
# drives a real `Engine` with a denying gate and with an admitting one and counts what arrived at the
# transport -- 0 and 1.
#
# The precedent is exact and it is the engine's own: `gx-engine` dev-depends on `gx-adapter-fs`
# ("for the benches only"), for the same reason in the other direction. **The no-shipped-adapter
# invariant is (sem: SEM-gx-adapter-mcp-036)
# untouched where it is written**: `[dependencies]` above names no engine, `cargo tree -e normal`
# shows none, and `probes/doubt/tests/workspace_doubt.rs` reads the shipping section. Moving either
# line up into `[dependencies]` compiles and is caught by one text gate only. (sem: SEM-gx-adapter-mcp-037)
[dev-dependencies]
gx-substrate-conformance = { path = "../gx-substrate-conformance", version = "0.1.2" }
gx-gate = { path = "../gx-gate", version = "0.1.2" }
gx-engine = { path = "../gx-engine", version = "0.1.2" }
gx-witness = { path = "../gx-witness", version = "0.1.2" }

# 🔴 One performance requirement -- "the latency the proxy adds is p99 <= 30ms". (sem: SEM-gx-adapter-mcp-038)
#
# The bench lives here rather than in `gx-api` because the subject is **this proxy**, and it reuses
# `tests/support/mod.rs` through `#[path]` rather than a second fixture: the server a measurement
# talks to has to be the server the contracts were measured against, or the number is about a third
# thing. (`gx-engine`'s benches could not do that — `tests/support` there calls
# `env!("CARGO_BIN_EXE_crash_probe")`, which cargo does not define for a bench. This one has no bin.)
#
# `harness = false`, no criterion: the measurement is a **paired difference** between two arms over
# one interleaved run, and criterion's batch-mean sampling has no shape for that. A bench raises no
# `test result:` line, so the floor does not move for it.
[[bench]]
name = "proxy_latency"
harness = false
