# The core types of the calculus and nothing else. The architecture spec places this crate first in
# the workspace and defines what it may not do: no I/O, deterministic, no unsafe.
[package]
name = "gx-core"
description = "Core types of the Glovrex transformation calculus. No I/O, deterministic."
version = "0.1.0"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-core-001)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish

# The architecture spec allows this crate "serde, thiserror and not much more" and it spends exactly
# that much. serde is not optional here: the acceptance criteria are stated as serde round-trip
# properties, so the derive is the acceptance criterion rather than a convenience. thiserror is named
# by the same spec ("errors are typed with thiserror") and carries `Error::OrderExceeded`.
# Neither performs I/O, which is what the no-I/O acceptance criterion actually forbids -- the
# definition-of-done reads "zero I/O crates in cargo tree", not "zero dependencies". (sem: SEM-gx-core-002)
#
# The dependency that matters in the other direction is the one that is absent for good:
# gx-core never names gx-canon, so the two crates cannot cycle.
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Test-only. They are absent from `cargo tree -p gx-core -e normal` and so cannot reach the
# shipped dependency graph. serde_json supplies the concrete format for the round trips of
# the acceptance criteria, which name serde but no encoding; gx-canon's DAG-CBOR cannot be used here
# because gx-core is forbidden to know that crate exists.
[dev-dependencies]
proptest = "1.11"
serde_json = "1"

# `#[cfg(kani)]` is set by the Kani driver and by nothing else, so rustc does not know the name
# and (since 1.80) says so. Declaring it here keeps `-D warnings` meaningful: the lint stays on
# for every *other* unexpected cfg, which is the one that would otherwise hide a typo in a
# `#[cfg(...)]` and silently drop the code under it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
