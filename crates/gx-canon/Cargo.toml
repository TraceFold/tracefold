# Canonical form and content addressing. The architecture spec gives this crate its module list and its
# dependency line; the encoding spec gives the rules those dependencies are asked to carry out.
[package]
name = "gx-canon"
description = "Canonical DAG-CBOR form, CID, and the JCS compatibility layer."
version = "0.1.2"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-canon-001)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish
repository.workspace = true           # `dist generate` reads this

# Every version below is the max_stable_version read off the crates.io API on 2026-08-07,
# and every license was checked at three points -- the published Cargo.toml (crates.io
# API), the GitHub API license field, and the LICENSE files in the repository -- and
# written into Desktop/GitRepo/REFERENCES.md the same day. Nothing here is used by
# any line of code yet: an early planning step declares and locks, and later steps
# spend. Declaring early is what makes the lock file part of the review rather than a
# side effect of the first commit that happens to need a hash.
[dependencies]
# The one-way edge. See crates/gx-core/src/lib.rs.
#
# `version` beside `path`: a path with no version requirement is a wildcard, and
# `cargo publish` refuses one on a crate that declares a license and a description as this one
# does -- so the manifest was shaped to be published and could not have been. Found by
# `cargo deny check bans` on its first real run (`deny.toml`, `wildcards = "deny"`); inside the
# workspace the path still wins and nothing about resolution changes. Same in gx-log and
# gx-witness.
gx-core = { path = "../gx-core", version = "0.1.2" }

# Named on this crate's dependency line in the architecture spec.
blake3 = "1.8"                        # Cid = BLAKE3-256 (this workspace's default hash choice)
serde_ipld_dagcbor = "0.7"            # canonical binary form
# The research note that selected the two together ("serde_ipld_dagcbor + ipld-core") is quoted
# elsewhere, so this is inside the approved table rather than an extra item on top.
# `Ipld` is the untyped value `is_canonical` needs: judging bytes canonical means decoding them
# to *some* value and asking the encoder what it would have written, and that question has to be
# askable without knowing which struct the bytes came from.
ipld-core = "0.4"                     # untyped DAG-CBOR value, for is_canonical
serde_json_canonicalizer = "0.3"      # RFC 8785 JCS compatibility layer

# Outside the original approved table until a later ruling approved them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"                      # Intent.goal and the JCS input
thiserror = "2"                       # the architecture spec, "errors are typed with thiserror" (sem: SEM-gx-canon-002)

# Off by default, and that is the point: it is what keeps the probe binary out of anything a
# published crate hands a user (see the [[bin]] block). Nothing in src/ reads it.
[features]
probe-bin = []

[dev-dependencies]
proptest = "1.11"                     # eight documented properties
# Depending on this package from its own dev-dependencies is what turns `probe-bin` on for test
# builds and only for them. `cargo test -p gx-canon` therefore builds the binary below and sets
# CARGO_BIN_EXE_gx_cid_probe; `cargo build`, `cargo install` and a consumer's build do not.
gx-canon = { path = ".", features = ["probe-bin"] }

# One acceptance criterion requires the second CID to come from "a separate binary" (sem: SEM-gx-canon-003), so the second binary is part of the
# acceptance criterion. The path keeps it out of src/, which the architecture spec fixes at four modules; cargo
# builds it ahead of the integration tests and hands them its location in CARGO_BIN_EXE_gx_cid_probe.
#
# `required-features` is the publish exclusion an erratum asks for
# ("the probe bin's status" (sem: SEM-gx-canon-004)). Cargo has no per-target `publish` key, and
# `exclude`-ing the file would make `cargo package` fail verification on a target whose source is
# missing -- so the exclusion is expressed as a feature that is off unless a test build turns it
# on. `cargo install gx-canon` installs no binary; `cargo test` still runs that criterion unconditionally.
[[bin]]
name = "gx_cid_probe"
path = "tests/bin/cid_probe.rs"
required-features = ["probe-bin"]

# 🔴 (`gx-mcp-wire/Cargo.toml` carries an identical note): `gx_cid_probe` is a
# `probe-bin`-gated test fixture, not shipped product. Opted out of `dist generate`'s default
# (every `[[bin]]` in the workspace) the same way.
[package.metadata.dist]
dist = false

# Two of the eight approved dependencies are cargo subcommands, not manifest entries, so they are
# installed by CI rather than declared here: cargo-nextest (the workspace test
# runner) and cargo-llvm-cov (line coverage). The eighth is base32 for the
# `gx1:<base32>` form; a ruling keeps it out of the manifest and writes
# RFC 4648 inside this crate instead, which costs one function and no dependency.

# `#[cfg(kani)]` is set by the Kani driver and by nothing else, so rustc does not know the name
# and (since 1.80) says so. Declaring it here keeps `-D warnings` meaningful: the lint stays on
# for every *other* unexpected cfg, which is the one that would otherwise hide a typo in a
# `#[cfg(...)]` and silently drop the code under it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
