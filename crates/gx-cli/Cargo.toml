# 41 §2's twelfth crate and 44 §1's surface: 「gx submit|plan|verify|commit|undo|cancel|escalation|
# receipt|replay|log|key|policy|serve（44準拠）」.
#
# 🔴 **M6 hand 1 implements none of the thirteen** (req/88 §6.2 手 1: 「subcommand は 1 本も実装しな
# い」). What this hand builds is the ground the subcommands stand on: the `.gx/` directory of
# req/56, the draft holding area M6-01 採(a) put there, the `.gx/index/` cache of M6-02 採(b), and
# the argument parser's error contract. A crate that existed and did nothing would be a crate a
# reader has to rule out (gx-engine's manifest says the same thing about `pipeline.rs` in M5 hand 1).
[package]
name = "gx-cli"
description = "The `gx` command line: `.gx/` layout, draft store, id-resolution cache (44 §1, req/56)."
version = "0.1.0"
edition = "2021"
rust-version.workspace = true         # 卓-1 採 (req/38 §47): 宣言は workspace に 1 度だけ
license = "Apache-2.0"                # 35 DR-5, DEFAULT column

# 🔴 The binary is named **`gx`** and not `gx-cli`. 44 spells every command `gx <verb>`, and
# NFR-019 asks for 「単一静的バイナリ」; a binary whose name did not match the documentation would be
# a rename waiting to happen at the worst moment (the release hand).
[[bin]]
name = "gx"
path = "src/main.rs"

# 🔴 **則 1** (req/88 §3 Λ1) is a claim about *this table* before it is a claim about the source.
# `gx-canon` is absent and may not be added: 41 §6 gives the canonical encode one door
# (「全canonical encodeはgx-canon経由のみ（迂回禁止）」), and a CLI that could mint a `Cid` could name
# a transformation the engine never saw. `gx-gate` and `gx-engine` are absent for a different and
# weaker reason — **the M5H1-1 rule, ruled 採(a) in req/38 §38**: 「出荷依存は**呼び出しが在る手で
# declare**」. This hand has no call into either. Hands 3 and 4 add them.
#
# `gx-core` is here because the two things this hand stores are keyed on gx-core ids (`IntentId`,
# `TransformationId`) and because `Cid::from_text` — the `gx1:` parser 44 §0's id-resolution needs —
# **lives in gx-core, not in gx-canon**. That is what makes 則 1 (i) satisfiable at all rather than a
# rule the CLI has to break to do its job: parsing a name is not minting one.
#
# 🔴 **N-13 does not extend to this crate, and req/88 §1 says so in as many words**: 「`gx-cli` は fs
# adapter を出荷依存する——CLI は『どの substrate か』を `--substrate` で受けて registry に register
# する層であり、adapter を知らなければ何もできない。N-13 が守るのは engine の中立性であって、CLI の
# 中立性ではない」. No adapter is declared **yet** — the same 「declare where it is called」 rule — and
# when hand 3 adds `gx-adapter-fs` here it is not a breach of anything.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement (M2 hand 6, req/55 §4 H6-1).
[dependencies]
gx-core = { path = "../gx-core", version = "0.1.0" }  # ids, `Cid::from_text`, `Intent`, `b64`

# 🔴 M6 hand 2, under the same rule hand 1 applied to `gx-gate`/`gx-engine` (req/38 §38 採(a):
# 「出荷依存は**呼び出しが在る手で declare**」). All three are **path** dependencies, so the external
# package count does not move: req/89 §2.3's 277 stands, and the read side costs zero new packages.
#
# `gx-witness` — `Receipt`, `verify_offline`, `KeyPair`, and `dsse::sign_checkpoint` (M6-24 採(b)'s
#   producer, whose caller count outside gx-witness was **0** before this hand).
# `gx-log`     — `LedgerStore`, `prove_inclusion`, `prove_consistency`, `unsigned_checkpoint`.
# `gx-engine`  — `EngineJournal` and `reconstruct`, which is the whole of replay after E-M5-2
#   (「replay は Σ のみを再構成する read-only 操作」). 🔴 Note what is **not** used: no `Engine` is
#   opened by any verb in this hand. Opening one would take a `Gate` and an `EvidenceSource` — a
#   judging apparatus, for four commands that read — and 則 1 is easier to keep when the surface
#   that could break it is not in scope.
#
# 🔴 `gx-canon` is still absent and still may not be added (41 §6, 則 1 (i)). It arrives here
# transitively through all three, which is exactly the point: this crate consumes values the canon
# layer produced and computes none.
gx-witness = { path = "../gx-witness", version = "0.1.0" }
gx-log = { path = "../gx-log", version = "0.1.0" }
gx-engine = { path = "../gx-engine", version = "0.1.0" }

# 🔴 M6 hand 3, under the same rule (「出荷依存は**呼び出しが在る手で declare**」). Both are **path**
# dependencies and both were already in this binary's transitive graph through `gx-engine`, so the
# external package count is **unchanged**: req/89 §2.3's 277 still stands and this hand adds zero
# registry packages.
#
# `gx-gate`        — `Gate::with_policies` and `packs::fs_pack`. The CLI **chooses the policy set**
#   the engine judges with and does not judge: 41 §4 keeps the one decision in `Gate::verify` and
#   則 1 (ii) is the mechanical check that this crate never constructs a `Verdict`. FR-028's
#   「pack の file が build に埋め込まれる経路が 1 本」 is why the bytes come from gx-gate's
#   `include_str!` rather than from a file this binary opens.
# `gx-adapter-fs`  — `FsAdapter`, registered into the engine's registry at
#   `session::Session::open`. 🔴 req/88 §1 already ruled this is not an N-13 breach: 「N-13 が守るのは
#   engine の中立性であって、CLI の中立性ではない」. `gx-engine`'s own manifest still declares no
#   adapter, and `ENGINE_SHIPPED_ADAPTERS=0` is unmoved.
gx-gate = { path = "../gx-gate", version = "0.1.0" }
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.0" }

# 🔴 **M7 hand 4** — the 既定 registry half of `req/38` §60's **R-9 対裁定**: 「既定 policy set と既定
# registry は**対**で決まる(pack を足しても adapter が register されなければ NotFound)」. Until this
# hand `gx submit --substrate git` parsed, wrote a draft and then failed at `plan` with 「no adapter
# for this substrate」 — 44 §1.2 documents the flag, and M4H5-5's rule (an argument that changes
# nothing must not look like one that worked) has a twin: a flag the documentation offers must not be
# one no invocation can satisfy. `gx-substrate` comes with it because
# `session::register_default_adapters` names the trait in its own body.
#
# 🔴 **M6-27's five points, measured before this line was written** (req/38 §47 採(a): 「依存 5 点実測を
# 宣言より先に」), by `tools/m7h4_dep_probe.sh` on the baseline commit 8990a44:
#
#   1. **package count**: `cargo tree -e normal -p gx-cli` **167 → 245 (+78)**. This is by far the
#      largest edge this binary has taken and the number is not softened: `gix` and its 56 `gix-*`
#      crates, plus `jiff`, `prodash`, `parking_lot`, `memmap2`, `rustix`, `tempfile`, `walkdir`,
#      `zlib-rs`. `Cargo.lock` does not move (369): every one of them is already resolved, because
#      `gx-adapter-git` has been a workspace member since M7 hand 1 and `cargo deny`/`cargo audit`
#      have been gating them for four hands.
#   2. **licences**: unchanged allow list. The one non-`MIT OR Apache-2.0` branch is `zlib-rs`
#      (Zlib), which req/38 §58 **R-12** already put in `deny.toml` with its reason and referred to
#      the Owner 卓 as a 35 DR-5 addition; that entry's 「暫定」 身分 is unchanged by this line and is
#      **not** re-decided here.
#   3. **MSRV**: `gix` declares 1.85, under this workspace's 1.89 (卓-1). No subtree raises it.
#   4. **duplicate roots**: none added — the closure is the one `gx-adapter-git` already resolves.
#   5. 🔴 **the offline verifier's surface**, which is the point that needed a judgement rather than a
#      number: the closure now holds `gix-transport`, `gix-protocol` and `gix-packetline`.
#      `crates/gx-cli/tests/ac_057.rs` stays green because it scans **declared** edges for the seven
#      names that can open a socket and `gix` is not one of them — but the honest statement is
#      stronger than the probe: `default-features = false` with only `sha1` compiles those three
#      **without any network backend** (no `curl`, no `reqwest`, no `blocking-http-transport`), so
#      what the binary gained is the git wire *format*, not a client. req/102 §8 records it as a
#      touched declaration rather than leaving it inside a comment.
gx-adapter-git = { path = "../gx-adapter-git", version = "0.1.0" }
gx-substrate = { path = "../gx-substrate", version = "0.1.0" }

# 🔴 Declared **after** M6-27's five-point measurement and not before (req/38 §47 M6-27 採(a):
# 「依存 5 点実測を宣言より先に」). The numbers are in req/89 §2; the short form is that `clap` 4.6.6
# is already resolved in this workspace through criterion's dev graph, so what it adds to
# `cargo tree -e normal` is **10 packages**, all `MIT OR Apache-2.0` or narrower, none requiring a
# rustc newer than 1.85, and `cargo deny check licenses` passes on the existing allow list without a
# single new entry.
clap = { version = "4", features = ["derive"] }

# 🔴 **M6 hand 6** — `gx serve` calls into it, so it moves from `[dev-dependencies]` to here under the
# rule this manifest has now applied five times (req/38 §38 採(a): 「出荷依存は**呼び出しが在る手で
# declare**」). 47 §1(a) fixes the direction — 「単一静的バイナリ(`gx-cli` が `gx serve` で `gx-api`
# 機能を内包)」 — and cargo would refuse the other way round.
#
# 🔴 **`tokio` is deliberately absent from this table.** The hand-6 brief: 「gx-cli に tokio は
# declare しない(serve は gx-api 側)」. `gx_api::serve` is a **blocking** function that builds its own
# runtime, so this binary stays synchronous and `main` keeps returning an `ExitCode`. What does change
# is the **closure**: axum, tokio, hyper and tower are now reachable from `gx` through this one edge,
# and `tests/ac_057.rs` asserts they arrive through this edge and no other — a networking crate
# declared anywhere else in this workspace's shipping graph is a red probe, which is what keeps
# 「the verifier links no network stack」 a measurement rather than a memory.
gx-api = { path = "../gx-api", version = "0.1.0" }

# The output format 44 §1.3 fixes (「単一オブジェクトを返すコマンドはstdoutに**改行終端の単一JSON**」)
# and the format the draft store and the index are written in. **Already a shipping dependency of
# five crates in this workspace**, so the package count does not move.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"                       # 41 §6, "エラーは thiserror で型化"

# 🔴 **M6 hand 5** — the test client 51 §7 names, and the crate it drives.
#
# > axum test client（`tower::ServiceExt`相当）でCLIと同一パイプラインを叩き、レスポンスを比較する
#
# `crates/gx-cli/tests/ac_055.rs` needs **both** surfaces, and only one of the two crates can name the
# other: 47 §1(a) makes the v0.1 artefact 「単一静的バイナリ(`gx-cli` が `gx serve` で `gx-api` 機能を
# 内包)」, so gx-cli is the crate that will depend on gx-api and gx-api may never depend back (cargo
# refuses the cycle). AC-055 therefore lives here.
#
# **A dev-dependency, not a shipping one**, under the same 「declare where it is called」 rule this
# manifest has applied four times (req/38 §38 採(a)): no verb in this binary calls into gx-api today.
# **Hand 6 promotes it**, when `gx serve` calls `gx_api::router`.
#
# All four are **already resolved**: `gx-api`/`gx-adapter-fs` are path dependencies, and `tokio
# 1.53.1` / `tower 0.5.3` arrive inside axum's own tree. Measured before declaring
# (`tools/m6h5_dep_probe.sh`): **+0 packages** each, licences inside `deny.toml`'s allow list,
# subtree `rust-version` max 1.71, no duplicate roots. req/89 §2.3's external 277 stands.
[dev-dependencies]
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.0" }
gx-gate = { path = "../gx-gate", version = "0.1.0" }
# 🔴 **M7 hand 4**, and it is the battery's doing rather than the plan's. `crates/gx-cli/tests/
# defaults.rs` measured `default_policies` and `register_default_adapters` and **not the branch that
# calls them**, so mutation (e) of `tools/verify_m7h4.sh` (put `open_engine`'s `None` arm back to
# `packs::fs_pack()`) survived the first run of the battery. The probe that closes it drives a real
# git transformation through the engine this binary opens, which needs a repository to point at.
# Same package, same version and same features as `gx-adapter-git`'s own dev entry, so nothing is
# added to any graph.
gix = { version = "0.86", default-features = false, features = ["sha1"] }
gx-engine = { path = "../gx-engine", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"

# 🔴 **What is still not here.** The scratch-directory helper the layout suite needs is six lines
# against `CARGO_TARGET_TMPDIR` (the shape gx-engine and gx-log already share, and for their stated
# reason: on this project's WSL2 setup `/tmp` is cleared while the machine sits idle). Pulling
# `tempfile` in to save them would move the external package count for a fixture, and this hand's
# whole second section is a count of what the two new crates cost.
