# 🔴 **This file is the PUBLIC `crates/gx-cli/Cargo.toml`**, staged at
# `public/crates/gx-cli/Cargo.toml` and synced over `crates/gx-cli/Cargo.toml` in
# github.com/TraceFold/tracefold. It is the private manifest with the three private-crate
# dependency lines removed and `default` emptied. The Rust source is **identical** in both trees --
# every use of those three crates sits behind `cfg(feature = ...)`.
#
# Keep it in step with the private `crates/gx-cli/Cargo.toml`.
# The architecture spec's twelfth crate and the API spec's surface: "gx submit|plan|verify|commit|undo|cancel|escalation|
# receipt|replay|log|key|policy|serve" (sem: SEM-gx-cli-381).
#
# 🔴 **An early hand implements none of the thirteen** ("not a single subcommand
# is implemented" (sem: SEM-gx-cli-382)). What this hand builds is the ground the subcommands stand
# on: the `.gx/` directory
# spec, the draft holding area a ruling put there, the `.gx/index/` cache another ruling put there, and
# the argument parser's error contract. A crate that existed and did nothing would be a crate a
# reader has to rule out (gx-engine's manifest says the same thing about `pipeline.rs` in its early
# hand).
[package]
name = "gx-cli"
description = "The `gx` command line: `.gx/` layout, draft store, id-resolution cache."
version = "0.1.0"
edition = "2021"
rust-version.workspace = true         # declared once, in the workspace, per the adopted MSRV decision (sem: SEM-gx-cli-383)
license = "Apache-2.0"                # Apache-2.0 is this workspace's default license choice
publish = false                       # no crate in this workspace is a designated publish target yet (public/README.md 'Not released'); additive guard against accidental cargo publish
repository.workspace = true           # `dist generate` reads this

# 🔴 The binary is named **`gx`** and not `gx-cli`. The API spec spells every command `gx <verb>`, and
# one requirement asks for "a single static binary" (sem: SEM-gx-cli-384); a binary whose name did
# not match the documentation would be
# a rename waiting to happen at the worst moment (the release hand).
[[bin]]
name = "gx"
path = "src/main.rs"

# 🔴 **A house rule** (sem: SEM-gx-cli-385) is a claim about *this table* before it is a claim about the source.
# `gx-canon` is absent and may not be added: the architecture spec gives the canonical encode one door
# ("every canonical encode goes through gx-canon only, bypass forbidden"; sem: SEM-gx-cli-386), and a CLI that could mint a `Cid` could name
# a transformation the engine never saw. `gx-gate` and `gx-engine` are absent for a different and
# weaker reason — **the "declare where it is called" rule, ruled adopted**: "a shipping dependency
# is declared by the hand where the call exists" (sem: SEM-gx-cli-387). This hand has no call into either. Later hands add them.
#
# `gx-core` is here because the two things this hand stores are keyed on gx-core ids (`IntentId`,
# `TransformationId`) and because `Cid::from_text` — the `gx1:` parser the API spec's id-resolution
# needs —
# **lives in gx-core, not in gx-canon**. That is what makes the house rule satisfiable at all rather (sem: SEM-gx-cli-388)
# than a
# rule the CLI has to break to do its job: parsing a name is not minting one.
#
# 🔴 **The no-substrate-adapter invariant does not extend to this crate, and an early design note says
# so in as many words**: "`gx-cli`
# ships an fs adapter as a dependency -- the CLI is the layer that takes 'which substrate' via
# `--substrate` and registers it into the registry; without knowing the adapter it can do nothing.
# What that invariant protects is the engine's neutrality, not the CLI's neutrality" (sem: SEM-gx-cli-389). No adapter is declared **yet** — the same "declare where it is called" rule — and
# when a later hand adds `gx-adapter-fs` here it is not a breach of anything.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase.
# 🔴 **Features — the three verbs whose mechanism is not in the public distribution.**
#
# Four crates are held private (`gx-adapter-mysql`, `gx-adapter-postgres`, `gx-confine`,
# `gx-mcp-wire`); three of them are dependencies of this binary. Before this two-manifest split, the public
# `Cargo.toml` declared them anyway, with hard `path` dependencies onto directories a public clone
# does not contain, so **every** cargo command in a fresh public clone exited 101 before it read a
# line of Rust (measured: `cargo metadata` and `cargo build --workspace` both 101).
#
# Cargo resolves an `optional` path dependency whether or not its feature is on (measured this lane:
# a missing path is a 101 with the feature OFF as well), so "optional" alone does not fix a public
# clone -- the public manifest must not name the dependency at all. What the features buy is that
# **one source tree** compiles in both places: every `use` of these three crates sits behind
# `cfg(feature = ...)`, the private manifest turns all three on by `default` below, and the public
# manifest (`public/crates/gx-cli/Cargo.toml`) ships the same source with `default = []` and the
# three dependency lines removed.
#
# This is the "write down what you cannot have" posture applied to the manifest itself: the public
# CLI does not pretend to carry `gx wrap`/`gx attach`/`gx detach`/`gx confine`/postgres sessions, and
# it does not silently drop them either -- the feature names are declared there with the reason.
[features]
# 🔴 **Empty in the public distribution.** The three features below name crates this
# tree does not carry, so none of them can be turned on here. They are still *declared*, so that
# the `cfg(feature = ...)` in the shared source is a known cfg rather than an unexpected one, and
# so that this file states plainly which verbs are absent and why rather than leaving a reader to
# infer it from a missing subcommand.
#
# Turning one on will not work in this tree: the crate it needs is not here and the build will say
# so. That is the intended answer -- "you cannot have this here" said out loud, which is the same
# posture the CLI itself takes when it refuses `--mcp-server` or `GX_CONFINEMENT`.
default = []
# `gx wrap`, `gx attach`, `gx detach`, `gx demo`'s MCP arm, and `gx wrap --check-config`.
mcp = []  # needs `gx-mcp-wire`, not in this distribution
# `gx confine` (derivation + the Landlock arm).
confine = []  # needs `gx-confine`, not in this distribution
# `--substrate postgres` sessions.
pg = []  # needs `gx-adapter-postgres`, not in this distribution
# 🔴 **`tui` is not a fourth empty stub** (checked before adding): the four crates held private
# (`gx-adapter-mysql`, `gx-adapter-postgres`, `gx-confine`,
# `gx-mcp-wire`) do not include `tui`'s dependency, the `gx-tui` package -- a plain workspace
# member already present in this tree (`tui/`, resolved through this workspace's one
# `Cargo.lock`). The terminal face this feature gates shipped to the public clone whole as its own
# package. Stubbing this to `[]` would silently turn off code and a dependency a public clone
# actually has, which is not what the three `[]` stubs above are for (each of them needs a crate
# this tree does not contain at all). So `tui` is declared with its real dependency, matching
# `crates/gx-cli/Cargo.toml` (private) exactly, and left out of `default` below for the same
# "public default build stays light" reason `default = []` already states.
tui = ["dep:gx-tui"]

[dependencies]
gx-core = { path = "../gx-core", version = "0.1.0" }  # ids, `Cid::from_text`, `Intent`, `b64`

# 🔴 A later hand, under the same rule an earlier hand applied to `gx-gate`/`gx-engine`:
# "a shipping dependency is declared by the hand where the call exists" (sem: SEM-gx-cli-390). All
# three are **path** dependencies, so the external
# package count does not move, and the read side costs zero new packages.
#
# `gx-witness` — `Receipt`, `verify_offline`, `KeyPair`, and `dsse::sign_checkpoint` (a ruling's (sem: SEM-gx-cli-391)
#   producer, whose caller count outside gx-witness was **0** before this hand).
# `gx-log`     — `LedgerStore`, `prove_inclusion`, `prove_consistency`, `unsigned_checkpoint`.
# `gx-engine`  — `EngineJournal` and `reconstruct`, which is the whole of replay after an earlier
#   ruling
#   ("replay is a read-only operation that reconstructs only Σ"; sem: SEM-gx-cli-392). 🔴 Note what is **not** used: no `Engine` is
#   opened by any verb in this hand. Opening one would take a `Gate` and an `EvidenceSource` — a
#   judging apparatus, for four commands that read — and the house rule is easier to keep when the (sem: SEM-gx-cli-393)
#   surface
#   that could break it is not in scope.
#
# 🔴 `gx-canon` is still absent and still may not be added (the architecture spec, house rule (i); sem: SEM-gx-cli-394). It arrives here
# transitively through all three, which is exactly the point: this crate consumes values the canon
# layer produced and computes none.
gx-witness = { path = "../gx-witness", version = "0.1.0" }
gx-log = { path = "../gx-log", version = "0.1.0" }
gx-engine = { path = "../gx-engine", version = "0.1.0" }

# 🔴 A later hand, under the same rule ("a shipping dependency is declared by the hand where the call exists"; sem: SEM-gx-cli-395). Both are **path**
# dependencies and both were already in this binary's transitive graph through `gx-engine`, so the
# external package count is **unchanged**: this hand adds zero
# registry packages.
#
# `gx-gate`        — `Gate::with_policies` and `packs::fs_pack`. The CLI **chooses the policy set**
#   the engine judges with and does not judge: the architecture spec keeps the one decision in
#   `Gate::verify` and
#   the house rule (ii) is the mechanical check that this crate never constructs a `Verdict`. One
#   functional requirement's
#   "there is exactly one road by which a pack's file gets embedded into the build" (sem: SEM-gx-cli-396) is why the bytes come from gx-gate's
#   `include_str!` rather than from a file this binary opens.
# `gx-adapter-fs`  — `FsAdapter`, registered into the engine's registry at
#   `session::Session::open`. 🔴 An earlier design note already ruled this is not a
#   no-substrate-adapter breach: "what that invariant
#   protects is the engine's neutrality, not the CLI's neutrality" (sem: SEM-gx-cli-397). `gx-engine`'s own manifest still declares no
#   adapter, and `ENGINE_SHIPPED_ADAPTERS=0` is unmoved.
gx-gate = { path = "../gx-gate", version = "0.1.0" }
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.0" }

# 🔴 **A later hand** — the default registry half of a paired ruling: "the
# default policy set and the default registry are decided **as a pair** (adding a pack without
# registering an adapter still gives NotFound)" (sem: SEM-gx-cli-398). Until this
# hand `gx submit --substrate git` parsed, wrote a draft and then failed at `plan` with "no adapter
# for this substrate" — the API spec documents the flag, and one house rule (an argument that changes
# nothing must not look like one that worked) has a twin: a flag the documentation offers must not be
# one no invocation can satisfy. `gx-substrate` comes with it because
# `session::register_default_adapters` names the trait in its own body.
#
# 🔴 **Five points, measured before this line was written** ("measure
# the five dependency points before declaring"; sem: SEM-gx-cli-399), by `tools/m7h4_dep_probe.sh` on the baseline commit 8990a44:
#
#   1. **package count**: `cargo tree -e normal -p gx-cli` **167 → 245 (+78)**. This is by far the
#      largest edge this binary has taken and the number is not softened: `gix` and its 56 `gix-*`
#      crates, plus `jiff`, `prodash`, `parking_lot`, `memmap2`, `rustix`, `tempfile`, `walkdir`,
#      `zlib-rs`. `Cargo.lock` does not move (369): every one of them is already resolved, because
#      `gx-adapter-git` has been a workspace member since an early hand and `cargo deny`/`cargo audit`
#      have been gating them for several hands.
#   2. **licences**: unchanged allow list. The one non-`MIT OR Apache-2.0` branch is `zlib-rs`
#      (Zlib), which an earlier ruling already put in `deny.toml` with its reason and referred to
#      the Owner's table as a license-default addition; that entry's "provisional" status is
#      unchanged by this line and is (sem: SEM-gx-cli-400)
#      **not** re-decided here.
#   3. **MSRV**: `gix` declares 1.85, under this workspace's 1.89 (the adopted MSRV decision; sem: SEM-gx-cli-401). No subtree raises it.
#   4. **duplicate roots**: none added — the closure is the one `gx-adapter-git` already resolves.
#   5. 🔴 **the offline verifier's surface**, which is the point that needed a judgement rather than a
#      number: the closure now holds `gix-transport`, `gix-protocol` and `gix-packetline`.
#      `crates/gx-cli/tests/ac_057.rs` stays green because it scans **declared** edges for the seven
#      names that can open a socket and `gix` is not one of them — but the honest statement is
#      stronger than the probe: `default-features = false` with only `sha1` compiles those three
#      **without any network backend** (no `curl`, no `reqwest`, no `blocking-http-transport`), so
#      what the binary gained is the git wire *format*, not a client. A ledger records it as a
#      touched declaration rather than leaving it inside a comment.
gx-adapter-git = { path = "../gx-adapter-git", version = "0.1.0" }
gx-substrate = { path = "../gx-substrate", version = "0.1.0" }

# 🔴 **A later phase** — the third adapter and the wire that made registering it
# true rather than decorative.
#
# The pair is the point. `gx-adapter-mcp` is the boundary, the grammar and the gate; `gx-mcp-wire` is
# the JSON-RPC framing and the proxy's two halves. Declaring the adapter without the wire is what
# `session::MCP_IS_NOT_REGISTERED` refused — "registering it behind a transport that refused
# everything would buy nothing" (sem: SEM-gx-cli-402) — and declaring the wire is what makes `policies/mcp/` reachable from
# this binary for the first time. The edge is a house rule's own shape one layer out: `gx wrap` is
# the single
# road from an agent's `tools/call` to `Engine::commit`, and this manifest is where that road becomes
# a fact about the shipping graph rather than a diagram.
#
# Neither crate adds an external package: `gx-mcp-wire` declares `serde`/`serde_json`, which this
# binary already carries, and refuses a linked MCP client library for the no-bypass acceptance
# criterion's reason.
gx-adapter-mcp = { path = "../gx-adapter-mcp", version = "0.1.0" }
# 🔴 **optional, behind the `mcp` feature**: `gx-mcp-wire` is one of the four crates
# held private, so it is absent from the public distribution. The dependency is
# `optional` and the source that names it is `cfg(feature = "mcp")`, which is what lets one source
# tree build in both places. `default` below turns it on, so the private build is unchanged.
# 🔴 `gx-mcp-wire` is not in the public distribution and is therefore not
# declared here at all. Cargo resolves an `optional` path dependency even when its
# feature is off (measured), so leaving the line in with `optional = true` would
# still make every cargo command in a public clone fail.

# 🔴 A later hand — `gx confine`'s derivation and its Landlock arm.
#
# The verb is here and the mechanism is not, for `gx-confine`'s own manifest reason: the applying
# half is `cfg(target_os = "linux")` and the deriving half is not, and a `cfg` fork in the middle of
# this crate's argument parser is the shape a design note's "part-applied is not applied" is about.
# What this manifest gains is one module (`src/confine.rs`) that reads a plan and `exec`s.
#
# 🔴 It brings `gx-canon` into this binary's **transitive** graph, and that is not the thing this
# manifest's house-rule note forbids. The prohibition is on *this crate's source* naming `gx_canon::`
# — `crates/gx-canon/tests/authority_boundary.rs` counts the lines and requires zero — and
# `src/confine.rs` names it nowhere. A dependency that mints ids on its own behalf is not a road
# from this binary to a mint.
#
# External packages: **+3** (`landlock`, `enumflags2`, `enumflags2_derive`), all
# `MIT OR Apache-2.0`. The external package count does move, and this is the line that says so rather than
# a comment elsewhere claiming it did not.
# 🔴 **optional, behind the `confine` feature** — same reason as `gx-mcp-wire` above.
# 🔴 `gx-confine` is not in the public distribution and is therefore not
# declared here at all. Cargo resolves an `optional` path dependency even when its
# feature is off (measured), so leaving the line in with `optional = true` would
# still make every cargo command in a public clone fail.

# 🔴 **A later development lane** — the fourth adapter, closing a
# gap where `gx-adapter-postgres` had been a workspace member since an early phase
# but was never wired to an `Engine` anywhere in this repository, so `gx plan` on
# `--substrate custom:postgres` always answered `no adapter named Custom("postgres")`. The adapter
# is a stateless `Copy` struct and its DSN is resolved lazily per method call
# (`gx_adapter_postgres::db::connect`, an environment variable), so registering it is free and a
# missing DSN is a named `Error::Unreadable` at use time rather than a fail-open — no feature gate,
# unlike `gx-adapter-mcp`'s transport (which genuinely cannot be built without a deployment-supplied
# `ToolTransport`).
#
# 🔴 **Five-point measurement, taken before this line** ("measure
# the five dependency points before declaring"; sem: SEM-gx-cli-404), on baseline commit `36405d3`:
#
#   1. **package count**: `cargo tree -e normal -p gx-cli` **261 → 286 (+25)**. `Cargo.lock`
#      itself does **not** move (414 packages, before and after): `gx-adapter-postgres` has been a
#      workspace member since an early phase, so every package this edge gains — `postgres`, `sqlparser`,
#      `tokio-postgres`, `postgres-protocol`, `postgres-types`, `phf`/`phf_shared` 0.13.1,
#      `rand`/`rand_core` 0.10.1, `stringprep`, `md-5`, `hmac`, `base64`, `const-oid`,
#      `fallible-iterator`, `whoami`, `recursive`(-proc-macro-impl), `siphasher`,
#      `unicode-bidi`/`unicode-properties`, `async-trait`, `futures-sink`, `tokio-util` — was
#      already resolved in the workspace graph; this edge only changes which member *reaches* them.
#   2. **licences**: unchanged allow list. `sqlparser` (Apache-2.0) and `postgres` (MIT OR
#      Apache-2.0) were first-hand checked earlier (`Desktop/GitRepo/REFERENCES.md` 2026-08-13 entry,
#      `crates/gx-adapter-postgres/Cargo.toml`'s own comment) — no new fetch, so no new REFERENCES.md
#      entry (gitrepo HARD is about the fetch, not the re-wiring).
#   3. **MSRV**: unchanged — the subtree already built as a workspace member under this workspace's
#      1.89 (the adopted MSRV decision; sem: SEM-gx-cli-405).
#   4. **duplicate roots**: none *new*. `gx-cli`'s own closure and `gx-adapter-postgres`'s agree on
#      `tokio 1.53.1` (the one runtime `gx-api`'s axum stack already put in this binary's closure —
#      `crates/gx-cli/tests/ac_057.rs`). The three duplicates `cargo deny check bans` reports
#      (`wasi` ×2, `phf_shared`, `rand_core`) are `deny.toml`'s existing skip-listed entries,
#      already skip-listed for exactly this subtree since `gx-adapter-postgres` joined
#      the workspace early — this edge adds no new duplicate.
#   5. **the offline verifier's surface** (`ac_057.rs::the_network_stack_reaches_the_verifier_
#      through_exactly_one_declared_edge`): unaffected. That probe scans each workspace member's own
#      `Cargo.toml` text for seven literal names (`axum`/`tokio`/`hyper`/`tower`/`reqwest`/`ureq`/
#      `curl`); `gx-adapter-postgres/Cargo.toml` declares none of them (its `tokio` arrives only
#      transitively, through `postgres`), so `declarers` stays exactly `["gx-api"]`.
#
# `version` beside `path`: `cargo deny check bans` reads a bare path dependency as a wildcard
# requirement, learned in an earlier build phase — the same line every other adapter's Cargo.toml
# carries.
# 🔴 **optional, behind the `pg` feature** — same reason as `gx-mcp-wire` above.
# 🔴 `gx-adapter-postgres` is not in the public distribution and is therefore not
# declared here at all. Cargo resolves an `optional` path dependency even when its
# feature is off (measured), so leaving the line in with `optional = true` would
# still make every cargo command in a public clone fail.

# 🔴 Declared **after** the five-point measurement and not before ("measure the five dependency
# points before declaring"; sem: SEM-gx-cli-406). The numbers show that `clap` 4.6.6
# is already resolved in this workspace through criterion's dev graph, so what it adds to
# `cargo tree -e normal` is **10 packages**, all `MIT OR Apache-2.0` or narrower, none requiring a
# rustc newer than 1.85, and `cargo deny check licenses` passes on the existing allow list without a
# single new entry.
clap = { version = "4", features = ["derive"] }

# 🔴 `gx-tui`, `tui`'s one dependency, path-resolved to the `tui/` workspace member -- same
# version, same shape as the private manifest. `version` beside `path` because `cargo deny check
# bans` reads a bare path dependency as a wildcard requirement. Optional, behind the `tui` feature,
# for a different reason than the `[]` stubs above: those three name crates absent from this tree,
# this one names a crate present in it and merely optional. The terminal library itself
# (`ratatui`) is not declared here any more -- it moved to `tui/Cargo.toml` with the package split,
# same version, same `default-features = false, features = ["crossterm"]`, off the
# termion/termwiz/termina/`palette` backends the default set would otherwise pull in.
gx-tui = { path = "../../tui", version = "0.1.0", optional = true }

# 🔴 **A later hand** — `gx serve` calls into it, so it moves from `[dev-dependencies]` to here under the
# rule this manifest has now applied five times: "a shipping dependency
# is declared by the hand where the call exists". The distribution spec fixes the direction — "single static binary
# (`gx-cli` embeds `gx-api`'s functionality via `gx serve`)" — and cargo would refuse the other way round.
#
# 🔴 **`tokio` is deliberately absent from this table.** The corresponding brief: "gx-cli does not declare
# tokio (serve is on gx-api's side)" (sem: SEM-gx-cli-408). `gx_api::serve` is a **blocking** function that builds its own
# runtime, so this binary stays synchronous and `main` keeps returning an `ExitCode`. What does change
# is the **closure**: axum, tokio, hyper and tower are now reachable from `gx` through this one edge,
# and `tests/ac_057.rs` asserts they arrive through this edge and no other — a networking crate
# declared anywhere else in this workspace's shipping graph is a red probe, which is what keeps
# "the verifier links no network stack" (sem: SEM-gx-cli-409) a measurement rather than a memory.
gx-api = { path = "../gx-api", version = "0.1.0" }

# The output format the API spec fixes ("a command that returns a single object puts a single
# newline-terminated JSON on stdout"; sem: SEM-gx-cli-410)
# and the format the draft store and the index are written in. **Already a shipping dependency of
# five crates in this workspace**, so the package count does not move.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"                       # the architecture spec, "errors are typed with thiserror" (sem: SEM-gx-cli-411)

# 🔴 **A later hand** — the test client the architecture spec names, and the crate it drives.
#
# > hit the same pipeline as the CLI with an axum test client (equivalent to
# > `tower::ServiceExt`) and compare the response (sem: SEM-gx-cli-412)
#
# `crates/gx-cli/tests/ac_055.rs` needs **both** surfaces, and only one of the two crates can name the
# other: the distribution spec makes the v0.1 artefact "single static binary (`gx-cli` embeds `gx-api`'s
# functionality via `gx serve`)" (sem: SEM-gx-cli-413), so gx-cli is the crate that will depend on gx-api and gx-api may never depend back (cargo
# refuses the cycle). That acceptance criterion therefore lives here.
#
# **A dev-dependency, not a shipping one**, under the same "declare where it is called" rule this (sem: SEM-gx-cli-414)
# manifest has applied four times: no verb in this binary calls into gx-api today.
# **A later hand promotes it**, when `gx serve` calls `gx_api::router`.
#
# All four are **already resolved**: `gx-api`/`gx-adapter-fs` are path dependencies, and `tokio
# 1.53.1` / `tower 0.5.3` arrive inside axum's own tree. Measured before declaring
# (`tools/m6h5_dep_probe.sh`): **+0 packages** each, licences inside `deny.toml`'s allow list,
# subtree `rust-version` max 1.71, no duplicate roots.
[dev-dependencies]
gx-adapter-fs = { path = "../gx-adapter-fs", version = "0.1.0" }
gx-gate = { path = "../gx-gate", version = "0.1.0" }
# 🔴 **A later hand**, and it is the battery's doing rather than the plan's. `crates/gx-cli/tests/
# defaults.rs` measured `default_policies` and `register_default_adapters` and **not the branch that
# calls them**, so mutation (e) of `tools/verify_m7h4.sh` (put `open_engine`'s `None` arm back to
# `packs::fs_pack()`) survived the first run of the battery. The probe that closes it drives a real
# git transformation through the engine this binary opens, which needs a repository to point at.
# Same package, same version and same features as `gx-adapter-git`'s own dev entry, so nothing is
# added to any graph.
gix = { version = "0.86", default-features = false, features = ["sha1"] }
gx-engine = { path = "../gx-engine", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"

