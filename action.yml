name: 'Tracefold Agent Mutation & Receipt Verifier'
description: 'Verifies pre-commit tool inverses, validates DSSE audit receipts, and checks Merkle tile log integrity in CI'
author: 'Tracefold Core Team'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  receipt-dir:
    description: 'Directory containing .dsse signed audit receipts'
    required: false
    default: '.agent-receipts'
  policy-path:
    description: 'Path to Cedar policy file for tool authorization gating'
    required: false
    default: 'policy.cedar'
  enforce-inverses:
    description: 'Require every mutation to have an offline checked inverse'
    required: false
    default: 'true'
  fail-on-tamper:
    description: 'Fail the build if any DSSE signature or Merkle tile proof fails'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run Tracefold Verification Gate
      shell: bash
      run: |
        echo "Running Tracefold Agent Mutation Gate..."
        echo "Receipt Directory: ${{ inputs.receipt-dir }}"
        echo "Policy Path: ${{ inputs.policy-path }}"
        echo "Enforce Inverses: ${{ inputs.enforce-inverses }}"
        if command -v gx &> /dev/null; then
          # Honest limit: `gx verify-receipts` is not a shipped subcommand yet
          # (the CLI ships `gx receipt verify`, see examples/ci/receipt-check.yml),
          # so even with gx installed this step currently fails -- which is the
          # intended fail-closed direction until the input mapping lands (issue #5).
          gx verify-receipts --dir "${{ inputs.receipt-dir }}" --policy "${{ inputs.policy-path }}"
        else
          # Fail-closed repair (issue #5): a gate that cannot run must not pass.
          # Retired fail-open stub, kept for the record and never executed:
          #   echo "Tracefold gate validation passed (stub check)."
          echo "::error::gx binary not found -- this check cannot pass without it. Install the gx CLI in a prior step (see examples/ci/receipt-check.yml) before running this action." >&2
          exit 1
        fi
